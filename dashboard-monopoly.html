<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Control - Teacher Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/monopoly.css">
    <style>
        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .team-card {
            padding: 25px;
            text-align: center;
            border-radius: 24px;
        }
        .team-card.boys { border-top: 8px solid var(--primary); }
        .team-card.girls { border-top: 8px solid var(--secondary); }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-group-3col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-small { padding: 8px; font-size: 0.8rem; }
        .btn-tiny { padding: 6px 4px; font-size: 0.7rem; border-radius: 8px; cursor: pointer; border: none; color: #fff; font-weight: 700; transition: all 0.2s; }
        .btn-tiny:hover { transform: scale(1.05); filter: brightness(1.2); }
        .btn-add { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-sub { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .move-input {
            width: 80px !important;
            display: inline-block !important;
            margin: 0 5px !important;
            text-align: center;
            font-weight: 800;
            color: var(--accent) !important;
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
        }
        .book-btn {
            margin-top: 12px;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            border: 2px dashed rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        .book-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.5);
            transform: scale(1.02);
        }
        .book-btn.boys:hover { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .book-btn.girls:hover { border-color: var(--secondary); box-shadow: 0 0 15px var(--secondary-glow); }
        .booked-info {
            margin-top: 8px;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }
        .booked-boys { color: #60a5fa; background: rgba(59,130,246,0.15); }
        .booked-girls { color: #f472b6; background: rgba(236,72,153,0.15); }
        .gov-btn-group {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .gov-btn {
            padding: 8px 4px;
            font-size: 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            color: #fff;
            font-weight: 700;
            transition: all 0.2s;
        }
        .gov-btn:hover { transform: scale(1.05); filter: brightness(1.2); }
        .gov-add { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .gov-sub { background: linear-gradient(135deg, #b45309, #92400e); }
        .winner-section {
            padding: 20px;
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
        }
        .winner-section input {
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="dashboard-monopoly">
    <div class="glass-card" style="margin: 20px; padding: 25px; text-align: center; border-bottom: 2px solid var(--primary);">
        <h1 style="font-size: 2.5rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Monopoly Quiz Manager</h1>
        <p style="color: var(--text-dim);">Teacher Control Panel • <a href="dashboard.html" style="color: var(--primary); text-decoration: none; font-weight: 800;">BACK TO HUB</a></p>
    </div>

    <div class="control-grid">
        <!-- Team Boys Control -->
        <div class="glass-card team-card boys">
            <h2 style="color: var(--primary); letter-spacing: 2px;">TEAM BOYS</h2>
            <div id="boysImgPreview" style="width: 120px; height: 120px; border-radius: 50%; background: #000; margin: 20px auto; overflow: hidden; border: 4px solid var(--primary); box-shadow: 0 0 20px var(--primary-glow);">
                <img id="boysImg" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                <div id="boysNoImg" style="padding-top: 45px; font-size: 0.8rem; color: var(--text-dim);">PHOTO</div>
            </div>
            <input type="file" accept="image/*" onchange="uploadPhoto('boys', this)" style="font-size: 0.7rem; max-width: 200px;">
            
            <div class="glass-card" style="padding: 20px; margin-top: 25px; background: rgba(0,0,0,0.3);">
                <div class="stat-label">Current Balance</div>
                <div id="boysMoney" class="stat-value" style="color: var(--accent);">৳ 500</div>
                <div class="btn-group">
                    <button class="btn-primary btn-small" onclick="adjustMoney('boys', 100)">+100</button>
                    <button class="btn-secondary btn-small" onclick="adjustMoney('boys', -100)">-100</button>
                    <button class="btn-primary btn-small" onclick="adjustMoney('boys', 50)">+50</button>
                    <button class="btn-secondary btn-small" onclick="adjustMoney('boys', -50)">-50</button>
                </div>
                <div class="btn-group-3col">
                    <button class="btn-tiny btn-add" onclick="adjustMoney('boys', 20)">+20</button>
                    <button class="btn-tiny btn-add" onclick="adjustMoney('boys', 10)">+10</button>
                    <button class="btn-tiny btn-add" onclick="adjustMoney('boys', 5)">+5</button>
                    <button class="btn-tiny btn-sub" onclick="adjustMoney('boys', -20)">-20</button>
                    <button class="btn-tiny btn-sub" onclick="adjustMoney('boys', -10)">-10</button>
                    <button class="btn-tiny btn-sub" onclick="adjustMoney('boys', -5)">-5</button>
                </div>
            </div>

            <div class="glass-card" style="padding: 20px; margin-top: 20px; background: rgba(0,0,0,0.3);">
                <div class="stat-label">Position</div>
                <div id="boysPosName" class="stat-value" style="font-size: 1.2rem; min-height: 3rem; display: flex; align-items: center; justify-content: center;">Start</div>
                <div id="boysBookedStatus"></div>
                <div style="margin-top: 15px;">
                    <button class="btn-primary" onclick="movePlayer('boys', 1)">+1</button>
                    <button class="btn-secondary" onclick="movePlayer('boys', -1)">-1</button>
                </div>
                <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <input type="number" id="boysMoveSteps" class="move-input" value="1" min="1" max="12">
                    <button class="btn-primary btn-small" style="width: auto;" onclick="movePlayer('boys', parseInt(document.getElementById('boysMoveSteps').value))">MOVE X STEPS</button>
                </div>
                <button class="book-btn boys" onclick="bookPlace('boys')">📌 BOOK THIS PLACE</button>
            </div>
        </div>

        <!-- Team Girls Control -->
        <div class="glass-card team-card girls">
            <h2 style="color: var(--secondary); letter-spacing: 2px;">TEAM GIRLS</h2>
            <div id="girlsImgPreview" style="width: 120px; height: 120px; border-radius: 50%; background: #000; margin: 20px auto; overflow: hidden; border: 4px solid var(--secondary); box-shadow: 0 0 20px var(--secondary-glow);">
                <img id="girlsImg" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                <div id="girlsNoImg" style="padding-top: 45px; font-size: 0.8rem; color: var(--text-dim);">PHOTO</div>
            </div>
            <input type="file" accept="image/*" onchange="uploadPhoto('girls', this)" style="font-size: 0.7rem; max-width: 200px;">

            <div class="glass-card" style="padding: 20px; margin-top: 25px; background: rgba(0,0,0,0.3);">
                <div class="stat-label">Current Balance</div>
                <div id="girlsMoney" class="stat-value" style="color: var(--accent);">৳ 500</div>
                <div class="btn-group">
                    <button class="btn-primary btn-small" onclick="adjustMoney('girls', 100)">+100</button>
                    <button class="btn-secondary btn-small" onclick="adjustMoney('girls', -100)">-100</button>
                    <button class="btn-primary btn-small" onclick="adjustMoney('girls', 50)">+50</button>
                    <button class="btn-secondary btn-small" onclick="adjustMoney('girls', -50)">-50</button>
                </div>
                <div class="btn-group-3col">
                    <button class="btn-tiny btn-add" onclick="adjustMoney('girls', 20)">+20</button>
                    <button class="btn-tiny btn-add" onclick="adjustMoney('girls', 10)">+10</button>
                    <button class="btn-tiny btn-add" onclick="adjustMoney('girls', 5)">+5</button>
                    <button class="btn-tiny btn-sub" onclick="adjustMoney('girls', -20)">-20</button>
                    <button class="btn-tiny btn-sub" onclick="adjustMoney('girls', -10)">-10</button>
                    <button class="btn-tiny btn-sub" onclick="adjustMoney('girls', -5)">-5</button>
                </div>
            </div>

            <div class="glass-card" style="padding: 20px; margin-top: 20px; background: rgba(0,0,0,0.3);">
                <div class="stat-label">Position</div>
                <div id="girlsPosName" class="stat-value" style="font-size: 1.2rem; min-height: 3rem; display: flex; align-items: center; justify-content: center;">Start</div>
                <div id="girlsBookedStatus"></div>
                <div style="margin-top: 15px;">
                    <button class="btn-primary" onclick="movePlayer('girls', 1)">+1</button>
                    <button class="btn-secondary" onclick="movePlayer('girls', -1)">-1</button>
                </div>
                <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <input type="number" id="girlsMoveSteps" class="move-input" value="1" min="1" max="12">
                    <button class="btn-primary btn-small" style="width: auto;" onclick="movePlayer('girls', parseInt(document.getElementById('girlsMoveSteps').value))">MOVE X STEPS</button>
                </div>
                <button class="book-btn girls" onclick="bookPlace('girls')">📌 BOOK THIS PLACE</button>
            </div>
        </div>

        <!-- Global Control -->
        <div class="glass-card team-card" style="border-top: 8px solid #8b5cf6;">
            <h2 style="color: #8b5cf6; letter-spacing: 2px;">GAME COMMANDS</h2>
            
            <div class="glass-card" style="padding: 20px; margin-top: 25px; background: rgba(0,0,0,0.3);">
                <div class="stat-label">Government Fund</div>
                <div id="govMoney" class="stat-value" style="color: #f59e0b;">৳ 5000</div>
                <div class="btn-group">
                    <button class="btn-primary btn-small" style="background:#f59e0b" onclick="adjustMoney('gov', 500)">+500</button>
                    <button class="btn-secondary btn-small" style="background:#b45309" onclick="adjustMoney('gov', -500)">-500</button>
                    <button class="btn-primary btn-small" style="background:#f59e0b" onclick="adjustMoney('gov', 200)">+200</button>
                    <button class="btn-secondary btn-small" style="background:#b45309" onclick="adjustMoney('gov', -200)">-200</button>
                </div>
                <div class="gov-btn-group">
                    <button class="gov-btn gov-add" onclick="adjustMoney('gov', 100)">+100</button>
                    <button class="gov-btn gov-add" onclick="adjustMoney('gov', 50)">+50</button>
                    <button class="gov-btn gov-add" onclick="adjustMoney('gov', 20)">+20</button>
                    <button class="gov-btn gov-add" onclick="adjustMoney('gov', 10)">+10</button>
                    <button class="gov-btn gov-add" onclick="adjustMoney('gov', 5)">+5</button>
                    <button class="gov-btn gov-sub" onclick="adjustMoney('gov', -100)">-100</button>
                    <button class="gov-btn gov-sub" onclick="adjustMoney('gov', -50)">-50</button>
                    <button class="gov-btn gov-sub" onclick="adjustMoney('gov', -20)">-20</button>
                    <button class="gov-btn gov-sub" onclick="adjustMoney('gov', -10)">-10</button>
                    <button class="gov-btn gov-sub" onclick="adjustMoney('gov', -5)">-5</button>
                </div>
            </div>

            <div style="margin-top: 40px;">
                <div class="stat-label">Turn Control</div>
                <button class="btn-primary" style="width: 100%; margin-bottom: 15px; background: #8b5cf6; height: 60px; font-size: 1.2rem;" onclick="switchTurn()">
                    NEXT TURN: <span id="turnText" style="font-weight: 900;">BOYS</span>
                </button>
            </div>

            <!-- Announce Winner Section -->
            <div class="winner-section">
                <div class="stat-label" style="margin-bottom: 10px;">🏆 Announce Winner</div>
                <input type="text" id="mClassName" placeholder="Class (e.g. 12)">
                <input type="text" id="mSectionName" placeholder="Section (e.g. Shitolokkha)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;">
                    <button class="btn-primary btn-small" style="background: #3b82f6; font-weight: 800;" onclick="handleAnnounce('boys')">🎉 BOYS WIN</button>
                    <button class="btn-primary btn-small" style="background: #ec4899; font-weight: 800;" onclick="handleAnnounce('girls')">🎉 GIRLS WIN</button>
                </div>
                <button class="btn-primary btn-small" onclick="handleClearWinner()" style="background: #64748b; margin-top: 10px; width: 100%;">CLOSE WINNER SCREEN</button>
            </div>
            
            <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <button class="btn-secondary" style="width: 100%; opacity: 0.7;" onclick="confirmReset()">RESET ENTIRE GAME</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/monopoly.js"></script>
    <script>
        const { MonopolyGame } = window;

        function updateUI() {
            const game = MonopolyGame.game;
            const board = MonopolyGame.boardData;

            document.getElementById('boysMoney').innerText = '৳ ' + game.boysScore;
            document.getElementById('girlsMoney').innerText = '৳ ' + game.girlsScore;
            document.getElementById('govMoney').innerText = '৳ ' + game.govScore;

            document.getElementById('boysPosName').innerText = board[game.boysPos].name;
            document.getElementById('girlsPosName').innerText = board[game.girlsPos].name;

            document.getElementById('turnText').innerText = game.currentTurn.toUpperCase();

            // Booked status for boys position
            const boysBookedEl = document.getElementById('boysBookedStatus');
            const bookedCells = game.bookedCells || {};
            if (bookedCells[game.boysPos]) {
                const owner = bookedCells[game.boysPos];
                boysBookedEl.innerHTML = `<div class="booked-info booked-${owner}">🔒 Booked by ${owner.toUpperCase()}</div>`;
            } else {
                boysBookedEl.innerHTML = '';
            }

            // Booked status for girls position
            const girlsBookedEl = document.getElementById('girlsBookedStatus');
            if (bookedCells[game.girlsPos]) {
                const owner = bookedCells[game.girlsPos];
                girlsBookedEl.innerHTML = `<div class="booked-info booked-${owner}">🔒 Booked by ${owner.toUpperCase()}</div>`;
            } else {
                girlsBookedEl.innerHTML = '';
            }

            // Images
            const bImg = document.getElementById('boysImg');
            const bNo = document.getElementById('boysNoImg');
            if(game.boysImage) {
                bImg.src = game.boysImage + '?v=' + Date.now();
                bImg.style.display = 'block';
                bNo.style.display = 'none';
            } else {
                bImg.style.display = 'none';
                bNo.style.display = 'block';
            }

            const gImg = document.getElementById('girlsImg');
            const gNo = document.getElementById('girlsNoImg');
            if(game.girlsImage) {
                gImg.src = game.girlsImage + '?v=' + Date.now();
                gImg.style.display = 'block';
                gNo.style.display = 'none';
            } else {
                gImg.style.display = 'none';
                gNo.style.display = 'block';
            }
        }

        async function uploadPhoto(team, input) {
            if(!input.files[0]) return;
            await MonopolyGame.saveTeamImage(team, input.files[0]);
            updateUI();
        }

        function adjustMoney(team, amount) {
            MonopolyGame.updateScore(team, amount);
            updateUI();
        }

        function movePlayer(team, steps) {
            MonopolyGame.movePlayer(team, steps);
            updateUI();
        }

        function switchTurn() {
            MonopolyGame.switchTurn();
            updateUI();
        }

        function bookPlace(team) {
            const game = MonopolyGame.game;
            const board = MonopolyGame.boardData;
            const pos = team === 'boys' ? game.boysPos : game.girlsPos;
            const placeName = board[pos].name;
            if(confirm(`Book "${placeName}" for TEAM ${team.toUpperCase()}?`)) {
                MonopolyGame.bookPlace(team);
                updateUI();
            }
        }

        function handleAnnounce(team) {
            const className = document.getElementById('mClassName').value || "12";
            const sectionName = document.getElementById('mSectionName').value || "Shitolokkha";
            MonopolyGame.announceWinner(team, className, sectionName);
        }

        function handleClearWinner() {
            MonopolyGame.clearWinner();
        }

        async function confirmReset() {
            if(confirm("CAUTION: This will reset all scores, positions, photos, bookings, and delete all uploaded images. Continue?")) {
                await MonopolyGame.resetGame();
                updateUI();
            }
        }

        updateUI();

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on('game-updated', (newState) => {
                MonopolyGame.setGame(newState);
                updateUI();
            });
            socket.on('image-updated', () => {
                MonopolyGame.loadGame();
                updateUI();
            });
        }
    </script>
</body>
</html>
