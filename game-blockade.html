<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockade 3D — Live Game</title>
    <meta name="description" content="Blockade 3D tactical board game — classroom game display" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/blockade.css" />
    <link rel="stylesheet" href="assets/fonts/local-fonts.css" />
  </head>
  <body class="blockade-game-body">
    <!-- Waiting Screen -->
    <div class="blk-waiting" id="blkWaiting">
      <div class="blk-waiting-title">🏰 Blockade 3D</div>
      <div class="blk-waiting-label">Join Code</div>
      <div class="blk-waiting-code" id="blkWaitingCode">------</div>
      <div class="blk-waiting-label" style="margin-top: 8px">
        Waiting for teacher to start the game...
      </div>
      <div class="blk-player-slots" id="blkWaitingSlots"></div>
    </div>

    <!-- HUD -->
    <div class="blk-hud" id="blkHud" style="display: none">
      <div id="blkHudLeft" class="blk-hud-player"></div>
      <div class="blk-hud-center">
        <div class="blk-hud-title" id="blkHudTitle">Blockade 3D</div>
        <div class="blk-hud-join-code" id="blkHudCode">------</div>
        <div class="blk-hud-turn" id="blkHudTurn"></div>
      </div>
      <div id="blkHudRight" class="blk-hud-player right"></div>
    </div>

    <!-- Board Stage -->
    <div class="blk-stage" id="blkStage" style="display: none">
      <div class="blk-board-container">
        <div class="blk-board" id="blkBoard"></div>
      </div>
    </div>

    <!-- Question Overlay (visible on projector when teacher sends question) -->
    <div class="blk-question-overlay" id="blkQuestionOverlay" style="display: none">
      <div class="blk-question-card">
        <div class="blk-question-header">
          <span style="font-size: 1.2rem; font-weight: 800">📝 Question Time!</span>
          <span class="blk-question-badge" id="blkQuestionBadge"></span>
        </div>
        <div class="blk-question-text" id="blkQuestionText"></div>
        <div class="blk-option-grid" id="blkOptionGrid"></div>
      </div>
    </div>

    <!-- Winner Overlay -->
    <div class="blk-winner-overlay" id="blkWinnerOverlay" style="display: none">
      <div class="blk-winner-trophy">🏆</div>
      <div class="blk-winner-text" id="blkWinnerText"></div>
      <div class="blk-rankings-list" id="blkRankingsList"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/blockade-engine.js"></script>
    <script>
      (function () {
        "use strict";

        const socket = io();
        const engine = window.BlockadeEngine;
        let gameState = null;
        let sessionId = null;

        const $ = (id) => document.getElementById(id);

        // ─── Create session on load ──────────────────────────
        socket.emit("blockade:create-session", {}, (res) => {
          if (res.success) {
            sessionId = res.sessionId;
            gameState = res.state;
            $("blkWaitingCode").textContent = res.code;
            renderWaiting();
          }
        });

        // ─── State updates ───────────────────────────────────
        socket.on("blockade:state", (state) => {
          gameState = state;
          render();
        });

        socket.on("blockade:answer-result", (data) => {
          showResultBanner(data.result);
          setTimeout(() => {
            const btns = $("blkOptionGrid").querySelectorAll(".blk-option-btn");
            const letters = ["A", "B", "C", "D"];
            btns.forEach((btn, i) => {
              if (letters[i] === data.correctAnswer) btn.classList.add("correct");
              else if (letters[i] === data.submittedAnswer && data.result === "incorrect") btn.classList.add("incorrect");
              btn.disabled = true;
            });
          }, 300);
          setTimeout(() => { $("blkQuestionOverlay").style.display = "none"; }, 3500);
        });

        // ─── Rendering ───────────────────────────────────────
        function render() {
          if (!gameState) return;

          if (gameState.phase === "waiting") { renderWaiting(); return; }

          $("blkWaiting").style.display = "none";
          $("blkHud").style.display = "flex";
          $("blkStage").style.display = "flex";

          renderHud();
          renderBoard();

          // Show question if active
          if (gameState.currentQuestion && !gameState.currentQuestion.answered) {
            renderQuestion();
          } else {
            $("blkQuestionOverlay").style.display = "none";
          }

          if (gameState.phase === "completed") renderWinner();
          else $("blkWinnerOverlay").style.display = "none";
        }

        function renderWaiting() {
          $("blkWaiting").style.display = "flex";
          $("blkHud").style.display = "none";
          $("blkStage").style.display = "none";
          if (!gameState) return;

          $("blkWaitingCode").textContent = gameState.code;
          const playerIds = Object.keys(gameState.players);
          $("blkWaitingSlots").innerHTML = playerIds
            .map((pid) => {
              const p = gameState.players[pid];
              const connected = !!p.controller || !!p.studentName;
              return `<div class="blk-player-slot ${connected ? "connected" : ""}" style="background:${p.color}">${p.name[0]}</div>`;
            })
            .join("");
        }

        function renderHud() {
          const players = Object.values(gameState.players);
          const half = Math.ceil(players.length / 2);
          $("blkHudLeft").innerHTML = players.slice(0, half).map(playerHudHTML).join("");
          $("blkHudRight").innerHTML = players.slice(half).map(playerHudHTML).join("");
          $("blkHudTitle").textContent = gameState.title;
          $("blkHudCode").textContent = gameState.code;

          const cp = gameState.players[gameState.currentPlayerId];
          if (cp) {
            $("blkHudTurn").textContent = `${cp.name}'s Turn`;
            $("blkHudTurn").style.background = cp.color;
            $("blkHudTurn").style.color = "white";
          }
        }

        function playerHudHTML(p) {
          const isCurrent = gameState.currentPlayerId === p.id;
          return `
            <div class="blk-hud-avatar ${isCurrent ? "active-turn" : ""}" style="background:${p.color};color:${p.color}">
              ${p.finished ? "🏁" : p.name[0]}
            </div>
            <div class="blk-hud-info">
              <div class="blk-hud-name" style="color:${p.color}">${p.name}${p.studentName && p.studentName !== p.name ? " · " + p.studentName : ""}</div>
              <div class="blk-hud-stats">
                <span>💰 ${p.credits}</span>
                <span>🧱 ${p.wallsRemaining}</span>
                ${p.rank ? `<span>🏆 #${p.rank}</span>` : ""}
              </div>
            </div>`;
        }

        function renderBoard() {
          const board = $("blkBoard");
          board.innerHTML = "";
          const BS = engine.BOARD_SIZE;

          for (let r = 0; r < BS; r++) {
            for (let c = 0; c < BS; c++) {
              const cell = document.createElement("div");
              cell.className = "blk-cell";
              cell.style.gridRow = r + 1;
              cell.style.gridColumn = c + 1;
              cell.dataset.row = r;
              cell.dataset.col = c;

              for (const [pid, p] of Object.entries(gameState.players)) {
                if (engine.isGoalCell(r, c, parseInt(pid), gameState.mode)) {
                  cell.classList.add("goal-cell", `goal-${p.name.toLowerCase()}`);
                }
              }

              const coord = document.createElement("span");
              coord.className = "blk-cell-coord";
              coord.textContent = `${r},${c}`;
              cell.appendChild(coord);
              board.appendChild(cell);
            }
          }

          // Player pieces
          for (const [pid, p] of Object.entries(gameState.players)) {
            if (p.finished) continue;
            const cell = board.querySelector(`.blk-cell[data-row="${p.position.row}"][data-col="${p.position.col}"]`);
            if (cell) {
              const piece = document.createElement("div");
              piece.className = `blk-piece ${gameState.currentPlayerId === p.id ? "current-turn" : ""}`;
              piece.style.background = p.color;
              piece.style.color = p.color;
              piece.textContent = p.name[0];
              cell.appendChild(piece);
            }
          }

          // Walls — compute cell size from actual rendered grid
          requestAnimationFrame(() => {
            const firstCell = board.querySelector(".blk-cell");
            if (!firstCell) return;
            const cellRect = firstCell.getBoundingClientRect();
            const cellSize = cellRect.width;
            const boardRect = board.getBoundingClientRect();
            // Gap = distance between adjacent cells
            const secondCell = board.querySelector('.blk-cell[data-row="0"][data-col="1"]');
            let gapSize = 3;
            if (secondCell) {
              const secondRect = secondCell.getBoundingClientRect();
              gapSize = secondRect.left - cellRect.right;
            }
            const unit = cellSize + gapSize;

            for (const w of gameState.walls) {
              const wallEl = document.createElement("div");
              wallEl.className = `blk-wall ${w.orientation}`;

              if (w.orientation === "horizontal") {
                wallEl.style.left = `${w.col * unit}px`;
                wallEl.style.top = `${(w.row + 1) * unit - gapSize / 2 - 3}px`;
                wallEl.style.width = `${2 * cellSize + gapSize}px`;
              } else {
                wallEl.style.left = `${(w.col + 1) * unit - gapSize / 2 - 3}px`;
                wallEl.style.top = `${w.row * unit}px`;
                wallEl.style.height = `${2 * cellSize + gapSize}px`;
              }

              board.appendChild(wallEl);
            }
          });

          // Legal moves
          if (gameState.phase === "active" && gameState.currentPlayerId) {
            const legalMoves = engine.getLegalMoves(gameState.currentPlayerId, gameState);
            for (const m of legalMoves) {
              const cell = board.querySelector(`.blk-cell[data-row="${m.row}"][data-col="${m.col}"]`);
              if (cell) cell.classList.add("legal-move");
            }
          }
        }

        function renderQuestion() {
          const q = gameState.currentQuestion;
          if (!q) return;

          const target = gameState.players[q.targetPlayerId];
          $("blkQuestionBadge").textContent = `For: ${target ? target.name : "Player"}`;
          $("blkQuestionBadge").style.background = target ? target.color : "#6366f1";
          $("blkQuestionBadge").style.color = "white";

          let html = q.question || "";
          if (q.image) html += `<br><img src="/uploads/qbank-images/${q.image}" alt="Question image" />`;
          $("blkQuestionText").innerHTML = html;

          const letters = ["A", "B", "C", "D"];
          $("blkOptionGrid").innerHTML = (q.options || [])
            .map((opt, i) => `
              <button class="blk-option-btn" disabled>
                <span class="opt-letter">${letters[i]}</span>
                <span>${opt}</span>
              </button>`).join("");

          $("blkQuestionOverlay").style.display = "flex";
        }

        function renderWinner() {
          if (!gameState.rankings || gameState.rankings.length === 0) return;
          const winner = gameState.rankings[0];
          const wp = gameState.players[winner.playerId];

          $("blkWinnerText").textContent = `${wp.name} Wins!`;
          $("blkWinnerText").style.color = wp.color;

          $("blkRankingsList").innerHTML = gameState.rankings
            .map((r) => {
              const p = gameState.players[r.playerId];
              return `<div class="blk-rank-item">
                <div class="rank-num">${r.rank}</div>
                <div style="color:${p.color};font-weight:800">${p.name}</div>
              </div>`;
            }).join("");

          $("blkWinnerOverlay").style.display = "flex";
        }

        function showResultBanner(result) {
          const banner = document.createElement("div");
          banner.className = `blk-result-banner ${result}`;
          banner.textContent = result === "correct" ? "✅ Correct! +2 Credits" : "❌ Incorrect";
          document.body.appendChild(banner);
          setTimeout(() => banner.remove(), 2500);
        }
      })();
    </script>
  </body>
</html>
