<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard Projector</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/questionbank.css" />
    <script src="/socket.io/socket.io.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700;900&display=swap');

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: radial-gradient(ellipse at 20% 50%, #0f172a 0%, #020617 100%);
        color: white;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        height: 100vh;
        width: 100vw;
      }

      /* ─── Live badge ─── */
      .live-badge {
        position: fixed;
        top: 18px; right: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        font-weight: 800;
        color: #10b981;
        letter-spacing: 2px;
        opacity: 0;
        transition: opacity 0.4s;
        z-index: 99;
      }
      .live-badge.show { opacity: 1; }
      .live-badge .dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: blink 1.5s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.4; transform: scale(0.7); }
      }

      /* ─── Outer layout ─── */
      .projector-view {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 28px 56px 24px;
      }

      /* ─── Header ─── */
      .header-bar {
        text-align: center;
        flex-shrink: 0;
        margin-bottom: 20px;
      }
      .header-bar h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 2.8rem;
        font-weight: 900;
        color: #f8fafc;
        letter-spacing: 4px;
        text-shadow: 0 0 40px rgba(56, 189, 248, 0.5), 0 0 80px rgba(56, 189, 248, 0.2);
        line-height: 1;
        margin-bottom: 8px;
      }
      .header-bar h3 {
        color: rgba(255,255,255,.4);
        font-weight: 500;
        font-size: 1.1rem;
        letter-spacing: 2px;
      }

      /* ─── Waiting screen ─── */
      .waiting-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 3rem;
        color: rgba(255,255,255,.15);
        text-align: center;
        flex-direction: column;
        gap: 20px;
      }
      .waiting-screen span {
        font-size: 1.3rem;
        color: rgba(255,255,255,.1);
        letter-spacing: 2px;
      }

      /* ─── Leaderboard ─── */
      #lbView {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #lbList {
        flex: 1;
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
        /* Hide scrollbar for Firefox */
        scrollbar-width: none;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      #lbList::-webkit-scrollbar {
        display: none;
      }

      /*
        Each row is permanently absolute-positioned.
        Movement is done by changing `top` — CSS does the smooth animation.
        NO FLIP. NO innerHTML swap during transit. Content only updates after row settles.
      */
      .lb-row {
        position: absolute;
        left: 0; right: 0;
        display: grid;
        /* rank | name | bar | scores | badge */
        grid-template-columns: 88px 1fr 2.8fr 240px 48px;
        align-items: center;
        gap: 18px;
        padding: 0 22px;
        border-radius: 16px;
        background: rgba(255,255,255,.03);
        border: 1px solid rgba(255,255,255,.05);
        /* ONLY top animates — position slides; nothing else */
        transition: top 0.75s cubic-bezier(0.34, 1.46, 0.64, 1);
        overflow: hidden;
      }

      /* Top-3 themes */
      .lb-row.top1 {
        background: linear-gradient(135deg, rgba(250,204,21,.1), rgba(250,204,21,.02));
        border-color: rgba(250,204,21,.25);
        box-shadow: 0 0 32px rgba(250,204,21,.1), inset 0 1px 0 rgba(250,204,21,.15);
      }
      .lb-row.top2 {
        background: linear-gradient(135deg, rgba(148,163,184,.1), rgba(148,163,184,.02));
        border-color: rgba(148,163,184,.25);
      }
      .lb-row.top3 {
        background: linear-gradient(135deg, rgba(180,83,9,.1), rgba(180,83,9,.02));
        border-color: rgba(180,83,9,.25);
      }

      /* Flash overlays (added/removed via JS class toggle) */
      @keyframes flashUp {
        0%   { box-shadow: 0 0 0 rgba(16,185,129,0); }
        25%  { box-shadow: 0 0 48px rgba(16,185,129,.7), inset 0 0 24px rgba(16,185,129,.15); }
        100% { box-shadow: 0 0 0 rgba(16,185,129,0); }
      }
      @keyframes flashDown {
        0%   { box-shadow: 0 0 0 rgba(239,68,68,0); }
        25%  { box-shadow: 0 0 40px rgba(239,68,68,.6), inset 0 0 20px rgba(239,68,68,.12); }
        100% { box-shadow: 0 0 0 rgba(239,68,68,0); }
      }
      .flash-up   { animation: flashUp   1.5s ease forwards; }
      .flash-down { animation: flashDown 1.5s ease forwards; }

      /* ─── Cell styles ─── */
      .lb-rank {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.7rem;
        font-weight: 900;
        text-align: center;
        color: #64748b;
        line-height: 1;
        user-select: none;
      }
      .lb-rank.r1 { color: #facc15; font-size: 2rem; text-shadow: 0 0 16px rgba(250,204,21,.5); }
      .lb-rank.r2 { color: #cbd5e1; font-size: 1.9rem; }
      .lb-rank.r3 { color: #d97706; font-size: 1.8rem; }

      .lb-name-block { min-width: 0; }
      .lb-name {
        font-size: 1.45rem;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.2;
      }
      .lb-roll {
        font-size: 0.88rem;
        color: rgba(255,255,255,.35);
        font-weight: 500;
        margin-top: 3px;
      }

      .lb-bar-wrap {
        height: 12px;
        background: rgba(255,255,255,.07);
        border-radius: 99px;
        overflow: hidden;
      }
      .lb-bar-fill {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #3b82f6, #06b6d4);
        transition: width 1.1s cubic-bezier(.4,0,.2,1);
        width: 0%;
      }
      #lbList.racing .lb-bar-fill {
        transition: none;
      }
      .top1 .lb-bar-fill { background: linear-gradient(90deg, #eab308, #fef08a); }
      .top2 .lb-bar-fill { background: linear-gradient(90deg, #94a3b8, #e2e8f0); }
      .top3 .lb-bar-fill { background: linear-gradient(90deg, #b45309, #fb923c); }

      .lb-score-cell {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }
      .lb-sub {
        display: flex;
        gap: 14px;
        font-size: 1rem;
        font-weight: 600;
        color: #94a3b8;
        white-space: nowrap;
      }
      .lb-sub .att  { color: #38bdf8; font-weight: 800; }
      .lb-sub .exam { color: #a78bfa; font-weight: 800; }
      .lb-total {
        font-family: 'Orbitron', sans-serif;
        font-size: 2.3rem;
        font-weight: 900;
        color: #fff;
        line-height: 1;
      }
      .top1 .lb-total { color: #facc15; text-shadow: 0 0 16px rgba(250,204,21,.4); }
      .top2 .lb-total { color: #f8fafc; }
      .top3 .lb-total { color: #fb923c; }

      .lb-badge {
        font-size: 0.95rem;
        font-weight: 900;
        text-align: center;
        line-height: 1.15;
        user-select: none;
      }
      .lb-badge.up   { color: #10b981; }
      .lb-badge.down { color: #ef4444; }
      .lb-badge.none { color: transparent; }

      /* ─── Table views ─── */
      #tableView {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .content-area {
        flex: 1;
        overflow-y: auto;
      }
    </style>
  </head>
  <body class="qb-font-bn">
    <div class="live-badge" id="liveBadge"><span class="dot"></span>LIVE</div>

    <div id="app" class="projector-view">

      <div class="waiting-screen" id="waitingScreen">
        <div>🏫 Interactive ClassRoom</div>
        <span>Waiting for data…</span>
      </div>

      <div id="lbView" style="display:none;">
        <div class="header-bar">
          <h1 id="lbTitle">🏆 STUDENT LEADERBOARD 🏆</h1>
          <h3 id="lbSubtitle"></h3>
        </div>
        <div id="lbList"></div>
      </div>

      <div id="tableView" style="display:none;">
        <div class="header-bar">
          <h1 id="tvTitle" style="font-size:2.2rem"></h1>
          <h3 id="tvSubtitle"></h3>
        </div>
        <div class="content-area" id="tvContent"></div>
      </div>
    </div>

    <script>
      const socket        = io();
      const liveBadge     = document.getElementById('liveBadge');
      const waitingScreen = document.getElementById('waitingScreen');
      const lbView        = document.getElementById('lbView');
      const lbList        = document.getElementById('lbList');
      const tableView     = document.getElementById('tableView');

      let currentMode = null;
      let raceTimer = null;

      // Map: roll → { el, rank }  — persistent row elements
      const rowMap = {};

      // ── helpers ──────────────────────────────────────────────────────────────
      function flashBadge() {
        liveBadge.classList.add('show');
        clearTimeout(liveBadge._t);
        liveBadge._t = setTimeout(() => liveBadge.classList.remove('show'), 3500);
      }

      function fillRowContent(el, student, idx, pct) {
        const rankText = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
        const rankCls  = idx === 0 ? 'r1'  : idx === 1 ? 'r2'  : idx === 2 ? 'r3'  : '';
        const topCls   = idx === 0 ? 'top1': idx === 1 ? 'top2': idx === 2 ? 'top3': '';

        // update class (strip old top/rank, keep flash classes)
        const keep = [...el.classList].filter(c => c.startsWith('flash'));
        el.className = ['lb-row', topCls, ...keep].filter(Boolean).join(' ');

        if (!el.dataset.initialized) {
          el.innerHTML = `
            <div class="lb-rank"></div>
            <div class="lb-name-block">
              <div class="lb-name"></div>
              <div class="lb-roll"></div>
            </div>
            <div class="lb-bar-wrap">
              <div class="lb-bar-fill"></div>
            </div>
            <div class="lb-score-cell">
              <div class="lb-sub">
                <span>Att: <span class="att"></span></span>
                <span>Exam: <span class="exam"></span></span>
              </div>
              <div class="lb-total"></div>
            </div>
            <div class="lb-badge"></div>
          `;
          el.dataset.initialized = "true";
        }

        const rankEl = el.querySelector('.lb-rank');
        rankEl.className = `lb-rank ${rankCls}`;
        rankEl.textContent = rankText;

        el.querySelector('.lb-name').textContent = student.name;
        el.querySelector('.lb-roll').textContent = `Roll: ${student.roll}`;
        
        const bar = el.querySelector('.lb-bar-fill');
        bar.style.width = `${pct}%`;

        el.querySelector('.att').textContent = student.attendanceScore;
        el.querySelector('.exam').textContent = student.examScore;
        el.querySelector('.lb-total').textContent = student.totalScore;

        const badgeEl = el.querySelector('.lb-badge');
        badgeEl.className = `lb-badge ${student._badgeCls}`;
        badgeEl.textContent = student._badgeHtml;
      }

      // ── Core render ──────────────────────────────────────────────────────────
      function renderLeaderboard(data, animate, fixedMaxScore = null) {
        const GAP        = 8;
        const containerH = lbList.getBoundingClientRect().height;
        const n          = data.length;
        const visibleCount = 8; // Exactly 8 items per view
        const ROW_H      = Math.floor((containerH - GAP * (visibleCount - 1)) / visibleCount);
        const maxScore   = fixedMaxScore !== null ? fixedMaxScore : Math.max(...data.map(d => d.totalScore), 1);

        // Ensure spacer for scrolling absolute elements
        let spacer = lbList.querySelector('.lb-spacer');
        if (!spacer) {
          spacer = document.createElement('div');
          spacer.className = 'lb-spacer';
          spacer.style.position = 'absolute';
          spacer.style.width = '1px';
          spacer.style.left = '0';
          spacer.style.top = '0';
          spacer.style.zIndex = '-1';
          lbList.appendChild(spacer);
        }
        spacer.style.height = `${n * ROW_H + (n > 0 ? (n - 1) * GAP : 0)}px`;

        // Compute badge info before touching DOM
        const now = Date.now();
        data.forEach((student, idx) => {
          const prev = rowMap[student.roll];
          const prevRank = prev ? prev.rank : null;
          if (animate && prevRank !== null && prevRank !== idx) {
            const moved = prevRank - idx; // positive = moved up
            student._badgeCls  = moved > 0 ? 'up' : 'down';
            student._badgeHtml = (moved > 0 ? '▲' : '▼') + Math.abs(moved);
            student._badgeExpires = now + 2000; // persist badge for 2s
          } else if (student._badgeExpires && now < student._badgeExpires) {
            // keep existing badge
          } else {
            student._badgeCls  = 'none';
            student._badgeHtml = '';
          }
        });

        // Collect rolls still in data
        const activeRolls = new Set(data.map(s => s.roll));

        // Remove rows no longer in data
        Object.keys(rowMap).forEach(roll => {
          if (!activeRolls.has(roll)) {
            rowMap[roll].el.remove();
            delete rowMap[roll];
          }
        });

        // Update / create each row, then set its `top`
        data.forEach((student, idx) => {
          const targetTop = idx * (ROW_H + GAP);
          const pct = ((student.totalScore / maxScore) * 100).toFixed(1);

          let entry = rowMap[student.roll];

          if (!entry) {
            // Brand new row — create, position instantly (no transition for first paint)
            const el = document.createElement('div');
            el.dataset.roll = student.roll;
            student._badgeCls  = 'none';
            student._badgeHtml = '';

            // Disable transition for initial placement
            el.style.transition = 'none';
            el.style.top    = targetTop + 'px';
            el.style.height = ROW_H + 'px';
            el.style.left   = '0';
            el.style.right  = '0';

            lbList.appendChild(el);
            fillRowContent(el, student, idx, pct);

            // Re-enable transition after first paint
            requestAnimationFrame(() => {
              el.style.transition = '';
            });

            rowMap[student.roll] = { el, rank: idx };
          } else {
            // Existing row — detect movement, update content, animate top
            const el        = entry.el;
            const prevRank  = entry.rank;
            const isMoving  = animate && prevRank !== idx;

            el.style.height = ROW_H + 'px';
            el.style.left   = '0';
            el.style.right  = '0';

            // Update content first (at old position — not visible yet if moving)
            fillRowContent(el, student, idx, pct);

            if (isMoving) {
              const isUp = prevRank > idx;
              const flashCls = isUp ? 'flash-up' : 'flash-down';
              el.classList.remove('flash-up', 'flash-down');
              // small delay so CSS sees the class addition as new
              requestAnimationFrame(() => {
                el.classList.add(flashCls);
                setTimeout(() => el.classList.remove(flashCls), 1600);
              });
            }

            // Set new top — CSS transition handles the slide
            el.style.top = targetTop + 'px';
            entry.rank   = idx;
          }
        });
      }

      // ── Socket: projector button ──────────────────────────────────────────────
      socket.on('leaderboard-show', ({ type, data, filters }) => {
        waitingScreen.style.display = 'none';

        const parts = [];
        if (filters.className) parts.push(`Class: ${filters.className}`);
        if (filters.section)   parts.push(`Section: ${filters.section}`);
        if (filters.session)   parts.push(`Session: ${filters.session}`);

        if (type === 'leaderboard') {
          currentMode = 'leaderboard';
          tableView.style.display = 'none';
          lbView.style.display    = 'flex';
          lbView.style.flexDirection = 'column';
          document.getElementById('lbTitle').textContent    = '🏆 STUDENT LEADERBOARD 🏆';
          document.getElementById('lbSubtitle').textContent = parts.join('  |  ');

          // Clear existing rows
          Object.values(rowMap).forEach(e => e.el.remove());
          Object.keys(rowMap).forEach(k => delete rowMap[k]);

          if (raceTimer) {
            cancelAnimationFrame(raceTimer);
            raceTimer = null;
          }
          lbList.classList.remove('racing');

          if (data.length === 0) return;

          const targetMaxScore = Math.max(...data.map(d => d.totalScore), 1);
          const duration = 25000; // 25 seconds race
          const totalIncrementPerMs = targetMaxScore / duration;

          // Initial random order, 0 scores
          let currentData = data.map(s => ({
            ...s,
            targetTotal: s.totalScore,
            targetAtt: s.attendanceScore,
            targetExam: s.examScore,
            totalScore: 0,
            attendanceScore: 0,
            examScore: 0,
            _currentTotalFloat: 0
          })).sort(() => Math.random() - 0.5);

          // Record initial random rank for each student
          currentData.forEach((s, i) => { s._initialRank = i; });

          renderLeaderboard(currentData, false, targetMaxScore);
          
          lbList.classList.add('racing');
          let startTime = null;

          function raceLoop(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            
            let allDone = true;
            const currentGlobalTotal = totalIncrementPerMs * elapsed;

            currentData.forEach(s => {
              if (s._currentTotalFloat < s.targetTotal) {
                allDone = false;
                s._currentTotalFloat = Math.min(s.targetTotal, currentGlobalTotal);
                s.totalScore = Math.round(s._currentTotalFloat);
                
                if (s.targetTotal > 0) {
                  const ratio = s._currentTotalFloat / s.targetTotal;
                  s.attendanceScore = Math.round(s.targetAtt * ratio);
                  s.examScore = s.totalScore - s.attendanceScore; // ensure perfect sum
                }
              }
            });

            currentData.sort((a, b) => b._currentTotalFloat - a._currentTotalFloat);
            renderLeaderboard(currentData, true, targetMaxScore);

            if (allDone || elapsed >= duration * 1.5) {
              lbList.classList.remove('racing');
              // Ensure perfect final values
              currentData.forEach(s => {
                s._currentTotalFloat = s.targetTotal;
                s.totalScore = s.targetTotal;
                s.attendanceScore = s.targetAtt;
                s.examScore = s.targetExam;
              });
              currentData.sort((a, b) => b.totalScore - a.totalScore);
              // Lock in permanent badges comparing final rank vs initial random rank
              currentData.forEach((s, finalIdx) => {
                const moved = s._initialRank - finalIdx; // positive = moved up from start
                if (moved > 0) {
                  s._badgeCls  = 'up';
                  s._badgeHtml = '▲' + moved;
                } else if (moved < 0) {
                  s._badgeCls  = 'down';
                  s._badgeHtml = '▼' + Math.abs(moved);
                } else {
                  s._badgeCls  = 'none';
                  s._badgeHtml = '—';
                }
                s._badgeExpires = Infinity; // never expire
              });
              renderLeaderboard(currentData, true, targetMaxScore);
              raceTimer = null;
            } else {
              raceTimer = requestAnimationFrame(raceLoop);
            }
          }
          
          raceTimer = requestAnimationFrame(raceLoop);

        } else {
          currentMode = type;
          lbView.style.display    = 'none';
          tableView.style.display = 'flex';
          tableView.style.flexDirection = 'column';
          document.getElementById('tvTitle').textContent    = type === 'attendance' ? '📋 ATTENDANCE GRID' : '📝 MARKS GRID';
          document.getElementById('tvSubtitle').textContent = parts.join('  |  ');
          renderTable(type, data);
        }
      });

      // ── Socket: live update ───────────────────────────────────────────────────
      socket.on('leaderboard-live-update', ({ data }) => {
        if (currentMode !== 'leaderboard') return;
        flashBadge();
        if (raceTimer) {
          cancelAnimationFrame(raceTimer);
          raceTimer = null;
        }
        lbList.classList.remove('racing');
        renderLeaderboard(data, true);
      });

      socket.on('classroom-navigate', ({ url }) => {
        if (url) window.location.href = url;
      });

      // ── Table rendering ───────────────────────────────────────────────────────
      function renderTable(type, data) {
        const el = document.getElementById('tvContent');
        const cell = 'padding:14px 18px;border:1px solid rgba(255,255,255,.1);font-size:1.15rem;';
        const head = cell + 'background:rgba(255,255,255,.06);font-weight:700;letter-spacing:1px;';

        if (!data.length) {
          el.innerHTML = '<h2 style="text-align:center;color:#666;margin-top:60px">No records found</h2>';
          return;
        }

        if (type === 'attendance') {
          let dates = new Set();
          data.forEach(s => (s.attendance||[]).forEach(a => dates.add(a.date)));
          dates = Array.from(dates).sort();
          let html = `<table style="width:100%;border-collapse:collapse"><thead><tr>
            <th style="${head}text-align:left">Roll</th>
            <th style="${head}text-align:left">Name</th>`;
          dates.forEach(d => { html += `<th style="${head}text-align:center">${d}</th>`; });
          html += `<th style="${head}text-align:center">Total ✅</th></tr></thead><tbody>`;
          data.forEach(s => {
            let tot = 0;
            html += `<tr><td style="${cell}">${s.roll}</td><td style="${cell}font-weight:600">${s.name}</td>`;
            dates.forEach(d => {
              const a = (s.attendance||[]).find(x => x.date === d);
              if (a && a.isPresent) { html += `<td style="${cell}color:#10b981;font-weight:800;text-align:center">✅</td>`; tot++; }
              else                  { html += `<td style="${cell}color:#ef4444;text-align:center">❌</td>`; }
            });
            html += `<td style="${cell}color:#f59e0b;font-weight:900;font-size:1.4rem;text-align:center">${tot}</td></tr>`;
          });
          el.innerHTML = html + '</tbody></table>';

        } else {
          const cols = ['CT1','CT2','CT3','CT4','CT5','HY','Y','PT','T','MT1','MT2','MCQ1','MCQ2','MCQ3','Rewards'];
          let html = `<table style="width:100%;border-collapse:collapse"><thead><tr>
            <th style="${head}text-align:left">Roll</th>
            <th style="${head}text-align:left">Name</th>`;
          cols.forEach(c => { html += `<th style="${head}text-align:center">${c}</th>`; });
          html += `<th style="${head}text-align:center">Total</th></tr></thead><tbody>`;
          data.forEach(s => {
            let tot = 0;
            html += `<tr><td style="${cell}">${s.roll}</td><td style="${cell}font-weight:600">${s.name}</td>`;
            cols.forEach(c => {
              const v = s.mark && s.mark[c] ? parseFloat(s.mark[c]) : 0;
              tot += v;
              html += `<td style="${cell}text-align:center">${v || '-'}</td>`;
            });
            html += `<td style="${cell}color:#f59e0b;font-weight:900;font-size:1.4rem;text-align:center">${tot}</td></tr>`;
          });
          el.innerHTML = html + '</tbody></table>';
        }
      }
    </script>
    <script src="js/wake-lock.js"></script>
  </body>
</html>
