<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Bank Projector</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/questionbank.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/questionbank.js"></script>
    <style>
      /* Override global body styles for projector page */
      html, body {
        overflow: hidden;           /* prevent page scroll */
        width: 100vw;
        height: 100vh;
        margin: 0; padding: 0;
      }
      body {
        /* remove the scanline effect for clean projector output */
        background-image:
          radial-gradient(circle at 20% 20%, rgba(99,102,241,.25) 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(236,72,153,.25) 0%, transparent 40%),
          repeating-linear-gradient(0deg,   rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 32px),
          repeating-linear-gradient(90deg,  rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 32px);
      }
      /* Remove the scanline pseudo-element from style.css */
      body::after { display: none; }
    </style>
  </head>
  <body class="qb-font-bn">
    <div id="app" class="projector-view">

      <!-- ═══════════════ WAITING SCREEN ═══════════════ -->
      <div class="waiting-screen" id="waitingScreen">
        <div class="ws-icon">📡</div>
        <div class="ws-title">Interactive ClassRoom</div>
        <div class="ws-subtitle">Waiting for teacher...</div>
        <div class="ws-dots">
          <span class="ws-dot"></span>
          <span class="ws-dot"></span>
          <span class="ws-dot"></span>
        </div>
      </div>

      <!-- ═══════════════ MCQ VIEW ═══════════════ -->
      <div id="mcqView" class="qb-view">
        <div class="header-bar">
          <div id="mcqTitle">📝 MCQ QUIZ</div>
          <div id="mcqTimer">⏱ <span id="timerText">00:00</span></div>
        </div>
        <div class="timer-bar-container">
          <div class="timer-bar" id="timerBar"></div>
        </div>
        <!-- content-area wraps mcqContent so overflow is managed properly -->
        <div class="content-area">
          <div id="mcqContent" class="qb-content-inner"></div>
        </div>
      </div>

      <!-- ═══════════════ CREATIVE QUESTION VIEW ═══════════════ -->
      <div id="cqView" class="qb-view">
        <div class="header-bar">
          <div id="cqTitle">✍️ Creative Questions</div>
        </div>
        <div class="content-area">
          <div id="cqContent" class="qb-content-inner"></div>
        </div>
      </div>

    </div>

    <script>
      const socket = io();

      socket.on('classroom-navigate', (data) => {
        if (data.url) window.location.href = data.url;
      });

      let questions = [];
      let currentIdx = 0;
      let timerObj = null;
      let maxTime = 0;
      let autoAdvanceTimeoutId = null;
      let autoAdvanceTimeRemaining = 0;
      let autoAdvanceStartTime = 0;

      const waitingScreen = document.getElementById('waitingScreen');
      const mcqView       = document.getElementById('mcqView');
      const cqView        = document.getElementById('cqView');

      function showView(view) {
        waitingScreen.style.display = 'none';
        mcqView.style.display       = 'none';
        cqView.style.display        = 'none';
        if (view) view.style.display = 'flex';
      }

      /* ── Start MCQ Quiz ── */
      socket.on('qbank-start-mcq-quiz', (data) => {
        showView(mcqView);
        questions  = data.questions;
        maxTime    = data.timer;
        currentIdx = 0;
        renderMcq();
      });

      socket.on('qbank-next-question', () => {
        if (currentIdx < questions.length - 1) { currentIdx++; renderMcq(); }
      });

      /* ── Show Answer ── */
      function showCurrentAnswer() {
        const q = questions[currentIdx];
        if (!q) return;
        const type = parseInt(q.type);
        if (type === 4) {
          const q1 = document.querySelector('.mcq-sub-question[data-sub="1"]');
          if (q1) highlightAnswer(q1, q.answer);
          const q2 = document.querySelector('.mcq-sub-question[data-sub="2"]');
          if (q2) highlightAnswer(q2, q.q2_answer);
        } else {
          highlightAnswer(document, q.answer);
        }
      }

      socket.on('qbank-show-answer', showCurrentAnswer);

      socket.on('qbank-pause-timer', () => {
        if (timerObj && !timerObj.isPaused()) timerObj.pause();
        if (autoAdvanceTimeoutId) {
          clearTimeout(autoAdvanceTimeoutId);
          autoAdvanceTimeoutId = null;
          autoAdvanceTimeRemaining -= (Date.now() - autoAdvanceStartTime);
        }
      });

      socket.on('qbank-resume-timer', () => {
        if (timerObj && timerObj.isPaused()) {
          timerObj.resume();
        } else if (!timerObj && autoAdvanceTimeRemaining > 0 && !autoAdvanceTimeoutId) {
          autoAdvanceStartTime = Date.now();
          autoAdvanceTimeoutId = setTimeout(advanceQuiz, autoAdvanceTimeRemaining);
        }
      });

      /* ── Auto Advance ── */
      function advanceQuiz() {
        if (currentIdx < questions.length - 1) {
          currentIdx++;
          renderMcq();
        } else {
          document.getElementById('mcqTitle').innerHTML = `📝 MCQ QUIZ &nbsp;•&nbsp; কুইজ সমাপ্ত ✅`;
          document.getElementById('mcqContent').innerHTML =
            `<div class="qb-quiz-end">
               <div class="qb-quiz-end-icon">🎉</div>
               <div class="qb-quiz-end-text">কুইজ শেষ হয়েছে!</div>
             </div>`;
        }
      }

      socket.on('qbank-end-quiz', () => {
        if (timerObj) timerObj.stop();
        waitingScreen.style.display = 'flex';
        mcqView.style.display       = 'none';
        cqView.style.display        = 'none';
      });

      /* ── Show Creative ── */
      socket.on('qbank-show-creative', (data) => {
        showView(cqView);
        const inner = document.getElementById('cqContent');
        inner.innerHTML = '<div class="cq-grid"></div>';
        const grid = inner.querySelector('.cq-grid');
        data.questions.forEach((q, i) => {
          grid.innerHTML += QuestionBank.formatCreative(q, i + 1);
        });
      });

      socket.on('qbank-close-creative', () => {
        waitingScreen.style.display = 'flex';
        mcqView.style.display       = 'none';
        cqView.style.display        = 'none';
      });

      /* ── Render MCQ ── */
      function renderMcq() {
        if (timerObj) timerObj.stop();
        if (autoAdvanceTimeoutId) clearTimeout(autoAdvanceTimeoutId);
        autoAdvanceTimeoutId = null;
        timerObj = null;

        const q = questions[currentIdx];
        document.getElementById('mcqTitle').innerHTML =
          `📝 MCQ QUIZ &nbsp;•&nbsp; প্রশ্ন ${QuestionBank.toBengaliNumber(currentIdx + 1)}/${QuestionBank.toBengaliNumber(questions.length)}`;

        const contentEl = document.getElementById('mcqContent');
        contentEl.innerHTML = `<div class="mcq-enter">${QuestionBank.formatMcq(q, currentIdx + 1)}</div>`;

        const timerText = document.getElementById('timerText');
        const timerBar  = document.getElementById('timerBar');

        timerObj = QuestionBank.createTimer(maxTime, (rem) => {
          timerText.innerText  = `${Math.floor(rem/60).toString().padStart(2,'0')}:${(rem%60).toString().padStart(2,'0')}`;
          timerBar.style.width = `${(rem / maxTime) * 100}%`;
        }, () => {
          timerObj = null;
          timerText.innerText  = '00:00';
          timerBar.style.width = '0%';
          showCurrentAnswer();
          autoAdvanceTimeRemaining = 3000;
          autoAdvanceStartTime     = Date.now();
          autoAdvanceTimeoutId     = setTimeout(advanceQuiz, autoAdvanceTimeRemaining);
        });
      }

      /* ── Highlight Answer (uses CSS classes, no inline styles that break animation) ── */
      function highlightAnswer(container, correctAns) {
        if (!correctAns) return;
        container.querySelectorAll('.mcq-option').forEach(opt => {
          if (opt.dataset.opt === String(correctAns)) {
            opt.classList.add('correct');
          } else {
            opt.classList.add('wrong-dim');
          }
        });
      }
    </script>
    <script src="js/wake-lock.js"></script>
  </body>
</html>
