<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Bank Projector</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/questionbank.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/questionbank.js"></script>
    <style>
      body {
        background-color: #0f172a;
        color: white;
        overflow: hidden;
      }
      .projector-view {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 40px;
        box-sizing: border-box;
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
      }
      .content-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: rgba(255,255,255,0.02);
        border-radius: 16px;
      }
      .waiting-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 3rem;
        color: rgba(255,255,255,0.3);
        text-align: center;
        flex-direction: column;
      }
      .waiting-screen span { font-size: 1.5rem; margin-top: 20px; }
    </style>
  </head>
  <body class="qb-font-bn">
    <div id="app" class="projector-view">
        <div class="waiting-screen" id="waitingScreen">
            <div>Interactive ClassRoom</div>
            <span>Waiting for teacher...</span>
        </div>
        
        <div id="mcqView" style="display:none; height:100%; display:flex; flex-direction:column;">
            <div class="header-bar">
                <div id="mcqTitle">📝 MCQ QUIZ</div>
                <div id="mcqTimer" style="display:flex; align-items:center; gap:10px;">
                    ⏱️ <span id="timerText">00:00</span>
                </div>
            </div>
            <div class="timer-bar-container"><div class="timer-bar" id="timerBar"></div></div>
            <div class="content-area" id="mcqContent"></div>
        </div>

        <div id="cqView" style="display:none; height:100%; display:flex; flex-direction:column;">
            <div class="header-bar">
                <div id="cqTitle">📝 Creative Questions</div>
            </div>
            <div class="content-area" id="cqContent"></div>
        </div>
    </div>

    <script>
      const socket = io();
      let questions = [];
      let currentIdx = 0;
      let timerObj = null;
      let maxTime = 0;
      let revealState = 0; // 0=none, 1=ans1 revealed, 2=ans2 revealed

      const waitingScreen = document.getElementById('waitingScreen');
      const mcqView = document.getElementById('mcqView');
      const cqView = document.getElementById('cqView');
      
      socket.on('qbank-start-mcq-quiz', (data) => {
          waitingScreen.style.display = 'none';
          cqView.style.display = 'none';
          mcqView.style.display = 'flex';
          
          questions = data.questions;
          maxTime = data.timer;
          currentIdx = 0;
          renderMcq();
      });

      socket.on('qbank-next-question', () => {
          if (currentIdx < questions.length - 1) {
              currentIdx++;
              renderMcq();
          }
      });

      function showCurrentAnswer() {
          const q = questions[currentIdx];
          if (!q) return;
          const type = parseInt(q.type);
          
          if (type === 4) {
              const q1 = document.querySelector('.mcq-sub-question[data-sub="1"]');
              if (q1) highlightAnswer(q1, q.answer);
              
              const q2 = document.querySelector('.mcq-sub-question[data-sub="2"]');
              if (q2) highlightAnswer(q2, q.q2_answer);
          } else {
              highlightAnswer(document, q.answer);
          }
      }

      socket.on('qbank-show-answer', showCurrentAnswer);

      socket.on('qbank-end-quiz', () => {
          waitingScreen.style.display = 'flex';
          mcqView.style.display = 'none';
          cqView.style.display = 'none';
          if (timerObj) timerObj.stop();
      });

      socket.on('qbank-show-creative', (data) => {
          waitingScreen.style.display = 'none';
          mcqView.style.display = 'none';
          cqView.style.display = 'flex';
          
          const container = document.getElementById('cqContent');
          container.innerHTML = '';
          data.questions.forEach((q, i) => {
              container.innerHTML += QuestionBank.formatCreative(q, i + 1);
          });
      });

      socket.on('qbank-close-creative', () => {
          waitingScreen.style.display = 'flex';
          mcqView.style.display = 'none';
          cqView.style.display = 'none';
      });

      function renderMcq() {
          if (timerObj) timerObj.stop();
          revealState = 0;
          const q = questions[currentIdx];
          document.getElementById('mcqTitle').innerHTML = `📝 MCQ QUIZ • প্রশ্ন ${QuestionBank.toBengaliNumber(currentIdx + 1)}/${QuestionBank.toBengaliNumber(questions.length)}`;
          document.getElementById('mcqContent').innerHTML = QuestionBank.formatMcq(q, currentIdx + 1);
          
          // Start timer
          const timerText = document.getElementById('timerText');
          const timerBar = document.getElementById('timerBar');
          
          timerObj = QuestionBank.createTimer(maxTime, (rem) => {
              timerText.innerText = `00:${rem.toString().padStart(2, '0')}`;
              timerBar.style.width = `${(rem / maxTime) * 100}%`;
          }, () => {
              // Timer complete auto advance logic
              timerText.innerText = `00:00`;
              timerBar.style.width = `0%`;
              
              // Show answer first
              showCurrentAnswer();
              
              // Wait 3 seconds then auto-advance
              setTimeout(() => {
                  if (currentIdx < questions.length - 1) {
                      currentIdx++;
                      renderMcq();
                  } else {
                      // End of quiz
                      document.getElementById('mcqTitle').innerHTML = `📝 MCQ QUIZ • সমাপ্ত`;
                      document.getElementById('mcqContent').innerHTML = `<h2 style="text-align:center; margin-top:50px;">কুইজ শেষ হয়েছে!</h2>`;
                  }
              }, 3000);
          });
      }

      function highlightAnswer(container, correctAns) {
          if (!correctAns) return;
          container.querySelectorAll('.mcq-option').forEach(opt => {
              if (opt.dataset.opt === String(correctAns)) {
                  opt.classList.add('correct');
              } else {
                  opt.style.opacity = '0.3';
              }
          });
      }
    </script>
  </body>
</html>
