<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Bank Projector</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/questionbank.css" />
    <link rel="stylesheet" href="css/student-practice.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/questionbank.js"></script>
    <style>
      /* Override global body styles for projector page */
      html, body {
        overflow: hidden;           /* prevent page scroll */
        width: 100vw;
        height: 100vh;
        margin: 0; padding: 0;
      }
      body {
        /* remove the scanline effect for clean projector output */
        background-image:
          radial-gradient(circle at 20% 20%, rgba(99,102,241,.25) 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(236,72,153,.25) 0%, transparent 40%),
          repeating-linear-gradient(0deg,   rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 32px),
          repeating-linear-gradient(90deg,  rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 32px);
      }
      /* Remove the scanline pseudo-element from style.css */
      body::after { display: none; }
    </style>
  </head>
  <body class="qb-font-bn">
    <div id="app" class="projector-view">

      <!-- ═══════════════ WAITING SCREEN ═══════════════ -->
      <div class="waiting-screen" id="waitingScreen">

        <!-- Waiting for teacher indicator -->
        <div class="ws-waiting-pill">
          <span class="ws-dot"></span>
          <span>📡 Waiting for teacher &mdash; or start below</span>
        </div>

        <div class="student-setup-view" id="studentSetupView">

          <!-- Panel Header -->
          <div class="ssp-header">
            <span class="ssp-icon">📚</span>
            <div>
              <div class="ssp-title">Student Practice</div>
              <div class="ssp-subtitle">Interactive ClassRoom &mdash; set your filters and start</div>
            </div>
          </div>

          <!-- Question Type Toggle -->
          <div class="ssp-type-toggle">
            <label class="ssp-radio-label">
              <input type="radio" name="studentQType" value="mcq" checked onchange="toggleStudentQType()">
              <span class="ssp-radio-box">📝 MCQ Quiz</span>
            </label>
            <label class="ssp-radio-label">
              <input type="radio" name="studentQType" value="cq" onchange="toggleStudentQType()">
              <span class="ssp-radio-box">✍️ Creative</span>
            </label>
          </div>

          <!-- Two-column form grid -->
          <div class="ssp-grid">

            <div class="ssp-field">
              <label class="ssp-label"><span class="ssp-field-icon">👤</span> Name</label>
              <input type="text" id="studentName" class="student-form-control" placeholder="Enter your name" />
            </div>

            <div class="ssp-field">
              <label class="ssp-label"><span class="ssp-field-icon">📄</span> Paper</label>
              <select id="studentPaper" class="student-form-control">
                <option value="All">All Papers</option>
                <option value="1st">1st Paper</option>
                <option value="2nd">2nd Paper</option>
              </select>
            </div>

            <div class="ssp-field">
              <label class="ssp-label"><span class="ssp-field-icon">📖</span> Chapter</label>
              <select id="studentChapter" class="student-form-control">
                <option value="">All Chapters</option>
              </select>
            </div>

            <div class="ssp-field">
              <label class="ssp-label"><span class="ssp-field-icon">🏷️</span> Topics</label>
              <input type="text" id="studentTopics" class="student-form-control" placeholder="All Topics" list="topicsSuggestions" autocomplete="off" />
              <datalist id="topicsSuggestions"></datalist>
            </div>

            <div class="ssp-field">
              <label class="ssp-label"><span class="ssp-field-icon">🔢</span> Amount</label>
              <select id="studentAmount" class="student-form-control">
                <option value="10">10 Questions</option>
                <option value="20">20 Questions</option>
                <option value="30">30 Questions</option>
                <option value="All">All Questions</option>
              </select>
            </div>

            <div class="ssp-field" id="studentTimerGroup">
              <label class="ssp-label"><span class="ssp-field-icon">⏱️</span> Timer per Q (sec)</label>
              <input type="number" id="studentTimer" class="student-form-control" value="30" min="5" />
            </div>

            <!-- Checkbox row spanning full width -->
            <div class="ssp-checks">
              <label class="ssp-check-label">
                <input type="checkbox" id="studentBoard" class="ssp-checkbox" />
                <span class="ssp-check-box">🏫 Board Q</span>
              </label>
              <label class="ssp-check-label">
                <input type="checkbox" id="studentCollege" class="ssp-checkbox" />
                <span class="ssp-check-box">🏢 College</span>
              </label>
              <label class="ssp-check-label" id="studentShowAnswerGroup" style="display:none;">
                <input type="checkbox" id="studentShowAnswer" class="ssp-checkbox" />
                <span class="ssp-check-box">🔑 Show Answer</span>
              </label>
            </div>

          </div>

          <button class="student-btn" onclick="startStudentPractice()">🚀 Start Practice</button>
        </div>
      </div>

      <!-- ═══════════════ MCQ VIEW ═══════════════ -->
      <div id="mcqView" class="qb-view">
        <div class="header-bar">
          <div id="mcqTitle">📝 MCQ QUIZ</div>
          <div id="mcqTimer">⏱ <span id="timerText">00:00</span></div>
        </div>
        <div class="timer-bar-container">
          <div class="timer-bar" id="timerBar"></div>
        </div>
        <!-- content-area wraps mcqContent so overflow is managed properly -->
        <div class="content-area">
          <div id="mcqContent" class="qb-content-inner"></div>
        </div>
      </div>

      <!-- ═══════════════ CREATIVE QUESTION VIEW ═══════════════ -->
      <div id="cqView" class="qb-view">
        <div class="header-bar">
          <div id="cqTitle">✍️ Creative Questions</div>
        </div>
        <div class="content-area">
          <div id="cqContent" class="qb-content-inner"></div>
        </div>
      </div>

      <!-- ═══════════════ STUDENT MCQ VIEW ═══════════════ -->
      <div id="studentMcqView" class="qb-view student-interactive">
        <div class="header-bar">
          <div id="studentMcqTitle">📝 Practice Quiz</div>
          <div id="studentMcqTimer">⏱ <span id="studentTimerText">00:00</span></div>
        </div>
        <div class="timer-bar-container">
          <div class="timer-bar" id="studentTimerBar"></div>
        </div>
        <div class="content-area">
          <div id="studentMcqContent" class="qb-content-inner"></div>
        </div>
      </div>

      <!-- ═══════════════ STUDENT CREATIVE QUESTION VIEW ═══════════════ -->
      <div id="studentCqView" class="qb-view student-interactive">
        <div class="header-bar">
          <div id="studentCqTitle">✍️ Creative Questions Practice</div>
          <button class="student-btn" style="padding: 6px 12px; font-size: 14px; width: auto;" onclick="showView(document.getElementById('waitingScreen'))">🔙 Go Back</button>
        </div>
        <div class="content-area">
          <div id="studentCqContent" class="qb-content-inner"></div>
        </div>
      </div>

      <!-- ═══════════════ STUDENT RESULT VIEW ═══════════════ -->
      <div id="studentResultView" class="qb-view">
        <div class="qb-quiz-end">
          <div class="qb-quiz-end-icon">🎓</div>
          <div id="studentResultTitle" class="qb-quiz-end-text">Practice Finished!</div>
          <div id="studentResultScore" style="color: white; font-size: 2.5rem; font-family: 'Exo 2'; margin-top: 10px;">Score: 0/0</div>
          <div id="studentResultMessage" style="color: #94a3b8; font-size: 1.5rem; margin-top: 10px; text-align: center; max-width: 800px; line-height: 1.4;"></div>
          <button class="student-btn" style="max-width: 250px; margin-top: 30px;" onclick="location.reload()">Back to Home</button>
        </div>
      </div>

    </div>

    <script>
      const socket = io();

      socket.on('classroom-navigate', (data) => {
        if (data.url) window.location.href = data.url;
      });

      let questions = [];
      let currentIdx = 0;
      let timerObj = null;
      let maxTime = 0;
      let autoAdvanceTimeoutId = null;
      let autoAdvanceTimeRemaining = 0;
      let autoAdvanceStartTime = 0;

      const waitingScreen = document.getElementById('waitingScreen');
      const mcqView       = document.getElementById('mcqView');
      const cqView        = document.getElementById('cqView');
      const studentMcqView    = document.getElementById('studentMcqView');
      const studentCqView     = document.getElementById('studentCqView');
      const studentResultView = document.getElementById('studentResultView');

      function showView(view) {
        waitingScreen.style.display = 'none';
        mcqView.style.display       = 'none';
        cqView.style.display        = 'none';
        studentMcqView.style.display    = 'none';
        studentCqView.style.display     = 'none';
        studentResultView.style.display = 'none';
        
        // Interrupt student practice if teacher forces a view
        if (view === mcqView || view === cqView) {
           if (typeof studentTimerObj !== 'undefined' && studentTimerObj) {
              studentTimerObj.stop();
              studentTimerObj = null;
           }
        }
        
        if (view) view.style.display = 'flex';
      }

      function toggleStudentQType() {
        const isCq = document.querySelector('input[name="studentQType"]:checked').value === 'cq';
        document.getElementById('studentTimerGroup').style.display = isCq ? 'none' : 'flex';
        document.getElementById('studentShowAnswerGroup').style.display = isCq ? '' : 'none';
      }

      /* ── Start MCQ Quiz ── */
      socket.on('qbank-start-mcq-quiz', (data) => {
        showView(mcqView);
        questions  = data.questions;
        maxTime    = data.timer;
        currentIdx = 0;
        renderMcq();
      });

      socket.on('qbank-next-question', () => {
        if (currentIdx < questions.length - 1) { currentIdx++; renderMcq(); }
      });

      /* ── Show Answer ── */
      function showCurrentAnswer() {
        const q = questions[currentIdx];
        if (!q) return;
        const type = parseInt(q.type);
        if (type === 4) {
          const q1 = document.querySelector('.mcq-sub-question[data-sub="1"]');
          if (q1) highlightAnswer(q1, q.answer);
          const q2 = document.querySelector('.mcq-sub-question[data-sub="2"]');
          if (q2) highlightAnswer(q2, q.q2_answer);
        } else {
          highlightAnswer(document, q.answer);
        }
      }

      socket.on('qbank-show-answer', showCurrentAnswer);

      socket.on('qbank-pause-timer', () => {
        if (timerObj && !timerObj.isPaused()) timerObj.pause();
        if (autoAdvanceTimeoutId) {
          clearTimeout(autoAdvanceTimeoutId);
          autoAdvanceTimeoutId = null;
          autoAdvanceTimeRemaining -= (Date.now() - autoAdvanceStartTime);
        }
      });

      socket.on('qbank-resume-timer', () => {
        if (timerObj && timerObj.isPaused()) {
          timerObj.resume();
        } else if (!timerObj && autoAdvanceTimeRemaining > 0 && !autoAdvanceTimeoutId) {
          autoAdvanceStartTime = Date.now();
          autoAdvanceTimeoutId = setTimeout(advanceQuiz, autoAdvanceTimeRemaining);
        }
      });

      /* ── Auto Advance ── */
      function advanceQuiz() {
        if (currentIdx < questions.length - 1) {
          currentIdx++;
          renderMcq();
        } else {
          document.getElementById('mcqTitle').innerHTML = `📝 MCQ QUIZ &nbsp;•&nbsp; কুইজ সমাপ্ত ✅`;
          document.getElementById('mcqContent').innerHTML =
            `<div class="qb-quiz-end">
               <div class="qb-quiz-end-icon">🎉</div>
               <div class="qb-quiz-end-text">কুইজ শেষ হয়েছে!</div>
             </div>`;
        }
      }

      socket.on('qbank-end-quiz', () => {
        if (timerObj) timerObj.stop();
        showView(waitingScreen);
      });

      /* ── Show Creative ── */
      socket.on('qbank-show-creative', (data) => {
        showView(cqView);
        const inner = document.getElementById('cqContent');
        inner.innerHTML = '<div class="cq-grid"></div>';
        const grid = inner.querySelector('.cq-grid');
        data.questions.forEach((q, i) => {
          grid.innerHTML += QuestionBank.formatCreative(q, i + 1, data.showAnswer);
        });
      });

      socket.on('qbank-close-creative', () => {
        showView(waitingScreen);
      });

      /* ── Render MCQ ── */
      function renderMcq() {
        if (timerObj) timerObj.stop();
        if (autoAdvanceTimeoutId) clearTimeout(autoAdvanceTimeoutId);
        autoAdvanceTimeoutId = null;
        timerObj = null;

        const q = questions[currentIdx];
        document.getElementById('mcqTitle').innerHTML =
          `📝 MCQ QUIZ &nbsp;•&nbsp; প্রশ্ন ${QuestionBank.toBengaliNumber(currentIdx + 1)}/${QuestionBank.toBengaliNumber(questions.length)}`;

        const contentEl = document.getElementById('mcqContent');
        contentEl.innerHTML = `<div class="mcq-enter">${QuestionBank.formatMcq(q, currentIdx + 1)}</div>`;

        const timerText = document.getElementById('timerText');
        const timerBar  = document.getElementById('timerBar');

        timerObj = QuestionBank.createTimer(maxTime, (rem) => {
          timerText.innerText  = `${Math.floor(rem/60).toString().padStart(2,'0')}:${(rem%60).toString().padStart(2,'0')}`;
          timerBar.style.width = `${(rem / maxTime) * 100}%`;
        }, () => {
          timerObj = null;
          timerText.innerText  = '00:00';
          timerBar.style.width = '0%';
          showCurrentAnswer();
          autoAdvanceTimeRemaining = 3000;
          autoAdvanceStartTime     = Date.now();
          autoAdvanceTimeoutId     = setTimeout(advanceQuiz, autoAdvanceTimeRemaining);
        });
      }

      /* ── Highlight Answer (uses CSS classes, no inline styles that break animation) ── */
      function highlightAnswer(container, correctAns) {
        if (!correctAns) return;
        container.querySelectorAll('.mcq-option').forEach(opt => {
          if (opt.dataset.opt === String(correctAns)) {
            opt.classList.add('correct');
          } else {
            opt.classList.add('wrong-dim');
          }
        });
      }

      /* ═════════════════════════════════════════════
         STUDENT PRACTICE LOGIC
         ═════════════════════════════════════════════ */
      let studentQuestions = [];
      let studentCurrentIdx = 0;
      let studentScore = 0;
      let studentTimerObj = null;
      let studentMaxTime = 30;
      let studentSelectedOption = null;
      let studentName = "";

      // Load Chapters on startup
      fetch('/api/mcq/chapters')
        .then(res => res.json())
        .then(chapters => {
          const select = document.getElementById('studentChapter');
          chapters.forEach(ch => {
            const opt = document.createElement('option');
            let chText = ch.toString();
            if (!chText.toLowerCase().includes('chapter')) chText = 'Chapter ' + chText;
            opt.value = chText;
            opt.innerText = chText;
            select.appendChild(opt);
          });
        })
        .catch(err => console.error(err));

      // Load all unique topics from MCQ + CQ for suggestions datalist
      Promise.all([
        fetch('/api/mcq/topics').then(r => r.json()).catch(() => []),
        fetch('/api/creative/topics').then(r => r.json()).catch(() => [])
      ]).then(([mcqTopics, cqTopics]) => {
        const allTopics = [...new Set([...mcqTopics, ...cqTopics])].sort();
        const datalist = document.getElementById('topicsSuggestions');
        allTopics.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          datalist.appendChild(opt);
        });
      });

      function startStudentPractice() {
        studentName = document.getElementById('studentName').value.trim();
        const qType = document.querySelector('input[name="studentQType"]:checked').value;
        const paper = document.getElementById('studentPaper').value;
        const chapter = document.getElementById('studentChapter').value;
        const amount = document.getElementById('studentAmount').value;
        const topics = document.getElementById('studentTopics').value.trim();
        const boardOnly = document.getElementById('studentBoard').checked;
        const importantOnly = document.getElementById('studentCollege').checked;
        const showAnswer = document.getElementById('studentShowAnswer').checked;

        studentMaxTime = parseInt(document.getElementById('studentTimer').value) || 30;

        if (!studentName) return alert("Please enter your name first!");

        let url = `/api/${qType === 'cq' ? 'creative' : 'mcq'}?amount=${amount}&paper=${paper}`;
        if (chapter) url += `&chapter=${encodeURIComponent(chapter)}`;
        if (topics) url += `&topics=${encodeURIComponent(topics)}`;
        if (boardOnly) url += `&boardOnly=true`;
        if (importantOnly) url += `&importantOnly=true`;
        if (qType === 'cq' && showAnswer) url += `&showAnswer=true`;

        fetch(url)
          .then(res => res.json())
          .then(data => {
            if (data.length === 0) return alert("No questions match the filter.");
            
            if (qType === 'mcq') {
              studentQuestions = data;
              studentCurrentIdx = 0;
              studentScore = 0;
              showView(studentMcqView);
              renderStudentMcq();
            } else {
              showView(studentCqView);
              const inner = document.getElementById('studentCqContent');
              inner.innerHTML = '<div class="cq-grid"></div>';
              const grid = inner.querySelector('.cq-grid');
              data.forEach((q, i) => {
                grid.innerHTML += QuestionBank.formatCreative(q, i + 1, showAnswer);
              });
            }
          })
          .catch(err => {
            alert("Failed to load questions. " + err.message);
          });
      }

      function renderStudentMcq() {
        if (studentTimerObj) studentTimerObj.stop();
        studentTimerObj = null;
        studentSelectedOption = null;

        const q = studentQuestions[studentCurrentIdx];
        document.getElementById('studentMcqTitle').innerHTML =
          `📝 Practice Quiz &nbsp;•&nbsp; প্রশ্ন ${QuestionBank.toBengaliNumber(studentCurrentIdx + 1)}/${QuestionBank.toBengaliNumber(studentQuestions.length)}`;

        const contentEl = document.getElementById('studentMcqContent');
        contentEl.innerHTML = `<div class="mcq-enter">${QuestionBank.formatMcq(q, studentCurrentIdx + 1)}</div>`;

        // Add click listeners to all options
        contentEl.querySelectorAll('.mcq-option').forEach(opt => {
          opt.addEventListener('click', function() {
            if (studentSelectedOption) return; // Prevent multiple selections
            
            // Mark as selected
            contentEl.querySelectorAll('.mcq-option').forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            studentSelectedOption = this.dataset.opt;
          });
        });

        const timerText = document.getElementById('studentTimerText');
        const timerBar  = document.getElementById('studentTimerBar');

        studentTimerObj = QuestionBank.createTimer(studentMaxTime, (rem) => {
          timerText.innerText  = `${Math.floor(rem/60).toString().padStart(2,'0')}:${(rem%60).toString().padStart(2,'0')}`;
          timerBar.style.width = `${(rem / studentMaxTime) * 100}%`;
        }, () => {
          studentTimerObj = null;
          timerText.innerText  = '00:00';
          timerBar.style.width = '0%';
          evaluateStudentAnswer();
        });
      }

      function evaluateStudentAnswer() {
        const q = studentQuestions[studentCurrentIdx];
        if (!q) return;
        
        let correctAns = q.answer;
        const type = parseInt(q.type);
        if (type === 4) {
           // For type 4, there are 2 questions. We will just use the first question's answer for scoring simplicity, 
           // or we'd need a more complex UI for the student to select 2 answers.
           // Since the prompt implied a standard MCQ practice, we will highlight both but only score based on Q1 if they clicked it.
           correctAns = q.answer;
        }

        // Highlight correct answer
        const container = document.getElementById('studentMcqContent');
        
        if (type === 4) {
          const q1 = container.querySelector('.mcq-sub-question[data-sub="1"]');
          if (q1) highlightAnswer(q1, q.answer);
          const q2 = container.querySelector('.mcq-sub-question[data-sub="2"]');
          if (q2) highlightAnswer(q2, q.q2_answer);
        } else {
          highlightAnswer(container, q.answer);
        }

        // Check if student selected the correct one
        if (studentSelectedOption && studentSelectedOption === String(correctAns)) {
           studentScore++;
        }

        // Wait 3 seconds then advance
        setTimeout(() => {
          studentCurrentIdx++;
          if (studentCurrentIdx < studentQuestions.length) {
            renderStudentMcq();
          } else {
            showStudentResults();
          }
        }, 3000);
      }

      function showStudentResults() {
        showView(studentResultView);
        
        const total = studentQuestions.length;
        document.getElementById('studentResultScore').innerText = `Score: ${studentScore} / ${total}`;
        
        const percentage = (studentScore / total) * 100;
        let message = "";
        
        if (percentage >= 80) {
           message = `Excellent, ${studentName}! You are a brilliant student! 🌟`;
        } else if (percentage >= 60) {
           message = `Good job, ${studentName}! You are a progressing student. 👍`;
        } else if (percentage >= 40) {
           message = `It's ok, ${studentName}. You need to study a bit more. 📚`;
        } else {
           message = `Don't give up, ${studentName}! Keep practicing and you will improve. 💪`;
        }
        
        document.getElementById('studentResultMessage').innerText = message;
      }
    </script>
    <script src="js/wake-lock.js"></script>
  </body>
</html>
