<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Flip - Agriculture Classroom</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 40px;
            overflow: hidden;
            background: #020617;
            gap: 20px;
        }

        .header-status {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .game-board {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 15px;
            width: 100%;
            margin: 0 auto;
            align-content: center;
        }

        .tile {
            aspect-ratio: 3/4 !important;
            width: 100%;
            height: auto !important;
            min-width: 0;
        }

        .tile-front {
            font-size: clamp(0.8rem, 1.5vw, 1.4rem) !important;
        }

        /* Overlays */
        .winner-overlay, .sync-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .winner-overlay {
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(20px);
        }

        .sync-overlay {
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            z-index: 3000;
        }

        .winner-content {
            padding: 60px;
            border: 4px solid var(--primary);
            box-shadow: 0 0 50px var(--primary-glow);
            max-width: 900px;
            width: 90%;
        }

        .winner-overlay.active {
            display: flex;
            animation: winnerFadeIn 0.5s ease-out;
        }

        @keyframes winnerFadeIn { 
            from { opacity: 0; transform: scale(0.9); } 
            to { opacity: 1; transform: scale(1); } 
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .game-board { grid-template-columns: repeat(6, 1fr); }
            .tile { aspect-ratio: 4/3 !important; }
            body { padding: 20px; }
        }

        @media (max-width: 800px) {
            .game-board { grid-template-columns: repeat(5, 1fr); }
            .tile { aspect-ratio: 4/3 !important; }
            .header-status { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="header-status">
        <div class="glass-card score-card boys neon-border-blue" style="padding: 10px">
            <div style="font-size: 0.7rem; color: #60a5fa">BOYS</div>
            <div id="boysScore" class="score-value" style="font-size: 1.5rem">0</div>
        </div>

        <div id="turnDisplay" class="turn-top turn-boys animate-float" style="font-size: 2rem; text-align: center;">
            BOYS TURN
        </div>

        <div class="glass-card score-card girls neon-border-pink" style="padding: 10px">
            <div style="font-size: 0.7rem; color: #f472b6">GIRLS</div>
            <div id="girlsScore" class="score-value" style="font-size: 1.5rem">0</div>
        </div>
    </div>

    <div id="gameBoard" class="game-board">
        <!-- Tiles will be injected here -->
    </div>

    <div id="syncOverlay" class="sync-overlay">
        <div class="glass-card" style="padding: 30px; width: 400px;">
            <h3 style="color: var(--secondary); margin-bottom: 15px;">📥 Syncing Images...</h3>
            <div class="progress-container">
                <div id="syncProgress" class="progress-bar"></div>
            </div>
            <p id="syncCount" style="margin-top: 10px; font-size: 0.8rem; color: var(--text-dim);">0 / 0 Received</p>
        </div>
    </div>

    <div id="winnerOverlay" class="winner-overlay">
        <div class="winner-content glass-card animate-float">
            <h1 id="winnerTitle" style="font-size: clamp(2rem, 8vh, 4rem); color: var(--secondary); margin-bottom: 20px;">Congratulations!</h1>
            <p id="winnerMsg" style="font-size: clamp(1rem, 4vh, 1.8rem); margin-bottom: 30px; line-height: 1.6;"></p>
            <div style="font-size: 5rem;">🏆</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/game.js"></script>
    <script>
        const { MemoryGame } = window;
        const board = document.getElementById("gameBoard");
        const turnDisplay = document.getElementById("turnDisplay");
        const boysScoreElem = document.getElementById("boysScore");
        const girlsScoreElem = document.getElementById("girlsScore");

        function initDOMTiles() {
            board.innerHTML = "";
            for (let i = 1; i <= 30; i++) {
                const card = document.createElement("div");
                card.id = `tile-${i}`;
                card.className = "tile";
                card.innerHTML = `
                    <div class="tile-inner">
                        <div class="tile-front shadow-2xl">T-${i}</div>
                        <div class="tile-back shadow-2xl"></div>
                    </div>
                `;
                board.appendChild(card);
            }
        }

        const imageCache = {};

        async function updateTileDOM(tile) {
            const card = document.getElementById(`tile-${tile.id}`);
            if (!card) return;

            const isFlipped = tile.flipped || tile.used || MemoryGame.game.previewMode;

            if (isFlipped) {
                if (!card.classList.contains("flipped")) card.classList.add("flipped");
            } else {
                if (card.classList.contains("flipped")) card.classList.remove("flipped");
            }

            if (tile.used) {
                if (!card.classList.contains("used")) card.classList.add("used");
            } else {
                if (card.classList.contains("used")) card.classList.remove("used");
            }

            if (tile.isWrong) {
                if (!card.classList.contains("wrong")) card.classList.add("wrong");
            } else {
                if (card.classList.contains("wrong")) card.classList.remove("wrong");
            }

            const front = card.querySelector(".tile-front");
            if (front.innerText !== tile.title) front.innerText = tile.title;

            const back = card.querySelector(".tile-back");
            
            // Only fetch image if needed and not cached or if it was updated
            if (back.innerHTML === "" || MemoryGame.lastImageUpdate === tile.id || MemoryGame.lastImageUpdate === "all") {
                if (MemoryGame.lastImageUpdate === "all") {
                    for (let key in imageCache) delete imageCache[key];
                }

                let imageData = imageCache[tile.id];
                if (!imageData || MemoryGame.lastImageUpdate === tile.id) {
                    imageData = await MemoryGame.getImage(tile.id);
                    if (imageData) imageCache[tile.id] = imageData;
                }

                back.innerHTML = imageData ? `<img src="${imageData}" />` : '<div style="color:var(--primary); font-size: 0.6rem;">No Image</div>';
            }
        }

        function updateUI() {
            MemoryGame.loadGame();
            boysScoreElem.innerText = MemoryGame.game.boysScore;
            girlsScoreElem.innerText = MemoryGame.game.girlsScore;

            const isBoys = MemoryGame.game.currentTurn === "boys";
            turnDisplay.innerText = isBoys ? "BOYS TURN" : "GIRLS TURN";
            turnDisplay.className = `turn-top ${isBoys ? "turn-boys" : "turn-girls"} animate-float`;

            const overlay = document.getElementById('winnerOverlay');
            const winnerMsg = document.getElementById('winnerMsg');
            if (MemoryGame.game.winner) {
                const winnerTeam = MemoryGame.game.winner === 'boys' ? 'Boys' : 'Girls';
                winnerMsg.innerHTML = `Congratulations to all <strong>${winnerTeam}</strong> of <br> Class: ${MemoryGame.game.classInfo} | Section: ${MemoryGame.game.sectionInfo}`;
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }

            MemoryGame.game.tiles.forEach((tile) => updateTileDOM(tile));
        }

        initDOMTiles();
        updateUI();

        if (typeof io !== "undefined") {
            const socket = io({
                transports: ['polling', 'websocket']
            });
            let syncTotal = 0;
            let syncCurrent = 0;

            socket.on("game-updated", (newState) => {
                MemoryGame.setGame(newState);
                updateUI();
            });

            socket.on("image-updated", async (data) => {
                const overlay = document.getElementById('syncOverlay');
                const progressBar = document.getElementById('syncProgress');
                const countText = document.getElementById('syncCount');

                if (data.id === 'sync-start') {
                    syncTotal = data.count;
                    syncCurrent = 0;
                    overlay.style.display = 'flex';
                    countText.innerText = `0 / ${syncTotal} Received`;
                    progressBar.style.width = '0%';
                    return;
                }

                if (data.id === 'all') {
                    console.log('Global image wipe received');
                    await MemoryGame.clearImages();
                    for (let key in imageCache) delete imageCache[key];
                    document.querySelectorAll('.tile-back').forEach(el => el.innerHTML = '');
                } else if (data.dataUrl) {
                    console.log('Remote image sync received for tile:', data.id);
                    await MemoryGame.saveImage(data.id, data.dataUrl);
                    imageCache[data.id] = data.dataUrl; // Update cache immediately
                    
                    // Specific tile update instead of full UI refresh
                    const tile = MemoryGame.game.tiles.find(t => t.id == data.id);
                    if (tile) {
                        MemoryGame.lastImageUpdate = data.id;
                        await updateTileDOM(tile);
                    }
                    
                    if (syncTotal > 0) {
                        syncCurrent++;
                        const percent = (syncCurrent / syncTotal) * 100;
                        progressBar.style.width = `${percent}%`;
                        countText.innerText = `${syncCurrent} / ${syncTotal} Received`;
                        
                        if (syncCurrent >= syncTotal) {
                            setTimeout(() => {
                                overlay.style.display = 'none';
                                syncTotal = 0;
                                alert("✅ All images synced successfully!");
                            }, 500);
                        }
                    }
                    return; // Prevent fall-through to full updateUI
                }
                MemoryGame.lastImageUpdate = data.id;
                updateUI();
            });
        }

        window.addEventListener("storage", (e) => {
            if (e.key === MemoryGame.STORAGE_KEY) updateUI();
        });
    </script>
</body>
</html>
