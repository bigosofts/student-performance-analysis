<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Authentication - Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7c3aed;
      --secondary: #06b6d4;
      --accent: #f59e0b;
      --error: #ef4444;
      --success: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050714;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Orbs */
    .bg-orbs {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      animation: drift 15s ease-in-out infinite;
    }
    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--primary), transparent);
      top: -150px;
      left: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--secondary), transparent);
      bottom: -100px;
      right: -100px;
      animation-delay: -5s;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -40px) scale(1.1); }
    }

    /* Container */
    .auth-card {
      background: rgba(15, 20, 50, 0.65);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 50px 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .icon-lock {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
      animation: pulseGlow 3s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }
      100% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.6); }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #f8fafc, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
      position: relative;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
    }
    .btn-submit:active { transform: translateY(0); }

    .err-msg {
      color: var(--error);
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .back-link {
      margin-top: 30px;
      display: block;
      color: #64748b;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover { color: #f8fafc; }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="auth-card">
    <div class="icon-lock">🔐</div>
    <h1>Teacher Central</h1>
    <p>Unlock the digital classroom dashboard</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="passcode">Security Passcode</label>
        <input type="password" id="passcode" class="form-input" placeholder="••••••••" autocomplete="current-password" required autofocus>
      </div>

      <button type="submit" class="btn-submit">
        <span>Authenticate Portal</span> →
      </button>

      <div class="err-msg" id="errMsg">
        ⚠️ Invalid teacher security passcode.
      </div>
    </form>

    <a href="index.html" class="back-link">← Cancel and return to Lobby</a>
  </div>

  <script>
    async function sha256(str) {
      const msgBuffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const code = document.getElementById('passcode').value;
      const hash = await sha256(code);
      
      const expected = '43d6437edfcb3bf85a09fce326fb58dd07b013a80179527152d52fb45ade38c5'; // SHA-256 of 'RCPSC2026'

      if (hash === expected) {
        sessionStorage.setItem('teacher_auth', hash);
        window.location.replace('dashboard.html');
      } else {
        const err = document.getElementById('errMsg');
        err.style.display = 'flex';
        // Force reflow/repaint to restart keyframe animation
        err.style.animation = 'none';
        err.offsetHeight; /* trigger reflow */
        err.style.animation = null;
        document.getElementById('passcode').value = '';
      }
    }
  </script>
    <script src="js/wake-lock.js"></script>
</body>
</html>
