<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Authentication - Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7c3aed;
      --secondary: #06b6d4;
      --accent: #f59e0b;
      --error: #ef4444;
      --success: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #050714;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 24px;
      -webkit-overflow-scrolling: touch;
    }

    /* Background Orbs */
    .bg-orbs {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      animation: drift 15s ease-in-out infinite;
    }
    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--primary), transparent);
      top: -150px;
      left: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--secondary), transparent);
      bottom: -100px;
      right: -100px;
      animation-delay: -5s;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -40px) scale(1.1); }
    }

    /* Container */
    .auth-card {
      background: rgba(15, 20, 50, 0.65);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 50px 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .icon-lock {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
      animation: pulseGlow 3s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }
      100% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.6); }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #f8fafc, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
      position: relative;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
    }
    .btn-submit:active { transform: translateY(0); }

    .err-msg {
      color: var(--error);
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .back-link {
      margin-top: 30px;
      display: block;
      color: #64748b;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover { color: #f8fafc; }

    @media (max-width: 640px) {
      body {
        align-items: stretch;
        padding: 18px;
      }

      .auth-card {
        width: 100%;
        max-width: none;
        min-height: calc(100svh - 36px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 34px 22px;
        border-radius: 22px;
      }

      .icon-lock {
        width: 62px;
        height: 62px;
        border-radius: 18px;
        font-size: 1.9rem;
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(1.55rem, 8vw, 2rem);
      }

      p {
        font-size: 0.92rem;
        margin-bottom: 26px;
      }

      .form-input,
      .btn-submit {
        min-height: 52px;
        font-size: 1rem;
      }

      .back-link {
        margin-top: 24px;
        line-height: 1.4;
      }

      .orb {
        filter: blur(80px);
        opacity: 0.2;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 12px;
      }

      .auth-card {
        min-height: calc(100svh - 24px);
        padding: 28px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="auth-card">
    <div class="icon-lock">🔐</div>
    <h1>Teacher Central</h1>
    <p>Unlock the digital classroom dashboard</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="passcode">Security Passcode</label>
        <input type="password" id="passcode" class="form-input" placeholder="••••••••" autocomplete="current-password" required autofocus>
      </div>

      <button type="submit" class="btn-submit">
        <span>Authenticate Portal</span> →
      </button>

      <div class="err-msg" id="errMsg">
        ⚠️ Invalid teacher security passcode.
      </div>
    </form>

    <a href="index.html" class="back-link">← Cancel and return to Lobby</a>
  </div>

  <script>
    // Proper SHA-256 implementation — works in both HTTPS and plain HTTP contexts
    function sha256Fallback(message) {
      const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      const ROTR = (x, n) => (x >>> n) | (x << (32 - n));

      // Encode string as UTF-8 bytes manually (no TextEncoder needed)
      const bytes = [];
      for (let ci = 0; ci < message.length; ci++) {
        let code = message.charCodeAt(ci);
        if (code < 0x80) { bytes.push(code); }
        else if (code < 0x800) { bytes.push(0xC0 | (code >> 6), 0x80 | (code & 0x3F)); }
        else { bytes.push(0xE0 | (code >> 12), 0x80 | ((code >> 6) & 0x3F), 0x80 | (code & 0x3F)); }
      }

      const bitLen = bytes.length * 8;
      bytes.push(0x80);
      while (bytes.length % 64 !== 56) bytes.push(0);
      // Append 64-bit big-endian length
      bytes.push(0,0,0,0);
      for (let s = 24; s >= 0; s -= 8) bytes.push((bitLen >>> s) & 0xff);

      for (let i = 0; i < bytes.length; i += 64) {
        const W = [];
        for (let t = 0; t < 16; t++)
          W[t] = (bytes[i+t*4]<<24)|(bytes[i+t*4+1]<<16)|(bytes[i+t*4+2]<<8)|bytes[i+t*4+3];
        for (let t = 16; t < 64; t++) {
          const s0 = ROTR(W[t-15],7) ^ ROTR(W[t-15],18) ^ (W[t-15]>>>3);
          const s1 = ROTR(W[t-2],17) ^ ROTR(W[t-2],19)  ^ (W[t-2]>>>10);
          W[t] = (W[t-16] + s0 + W[t-7] + s1) | 0;
        }
        let [a,b,c,d,e,f,g,h] = H;
        for (let t = 0; t < 64; t++) {
          const S1   = ROTR(e,6) ^ ROTR(e,11) ^ ROTR(e,25);
          const ch   = (e & f) ^ (~e & g);
          const tmp1 = (h + S1 + ch + K[t] + W[t]) | 0;
          const S0   = ROTR(a,2) ^ ROTR(a,13) ^ ROTR(a,22);
          const maj  = (a & b) ^ (a & c) ^ (b & c);
          const tmp2 = (S0 + maj) | 0;
          h=g; g=f; f=e; e=(d+tmp1)|0; d=c; c=b; b=a; a=(tmp1+tmp2)|0;
        }
        H = [H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0);
      }
      return H.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
    }

    async function sha256(str) {
      // Prefer native crypto.subtle when available (HTTPS / localhost)
      if (window.crypto && window.crypto.subtle) {
        const msgBuffer = new TextEncoder().encode(str);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }
      // Fallback for plain HTTP (e.g. mobile via local IP hotspot)
      return sha256Fallback(str);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const code = document.getElementById('passcode').value;
      const hash = await sha256(code);
      
      const expected = '43d6437edfcb3bf85a09fce326fb58dd07b013a80179527152d52fb45ade38c5'; // SHA-256 of 'RCPSC2026'

      if (hash === expected) {
        sessionStorage.setItem('teacher_auth', hash);
        window.location.replace('dashboard.html');
      } else {
        const err = document.getElementById('errMsg');
        err.style.display = 'flex';
        // Force reflow/repaint to restart keyframe animation
        err.style.animation = 'none';
        err.offsetHeight; /* trigger reflow */
        err.style.animation = null;
        document.getElementById('passcode').value = '';
      }
    }
  </script>
    <script src="js/wake-lock.js"></script>
</body>
</html>
