<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body class="min-h-screen bg-omr-bg">
  <div id="app">
    <!-- Header -->
    <header id="mainHeader" class="header-gradient sticky top-0 z-50 backdrop-blur-md bg-slate-900/90 border-b border-slate-700/60 shadow-lg">
      <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-omr-primary via-indigo-600 to-purple-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-omr-primary/30">
            O
          </div>
          <div>
            <h1 class="text-white font-bold text-base md:text-lg leading-tight flex items-center gap-2">
              <span>OMR Sheet Reader</span>
              <span class="hidden sm:inline-block px-2 py-0.5 text-[10px] font-mono text-emerald-400 bg-emerald-950/60 rounded-full border border-emerald-500/40">
                Live Scan
              </span>
            </h1>
            <p class="text-omr-text-muted text-xs font-bengali">রাজেন্দ্রপুর ক্যান্টনমেন্ট পাবলিক স্কুল ও কলেজ</p>
          </div>
        </div>

        <!-- Navigation Mode Tabs -->
        <nav class="flex items-center p-1 rounded-xl bg-slate-950/70 border border-slate-800 shadow-inner">
          <button id="tabLiveScan" data-mode="live-scan"
            class="nav-tab px-3 md:px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span id="labelNavLive">Live Scan</span>
          </button>

          <button id="tabCalibration" data-mode="calibration"
            class="nav-tab px-3 md:px-4 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
            </svg>
            <span id="labelNavCalib">Calibrator</span>
          </button>
        </nav>

        <!-- Language toggle -->
        <div class="flex items-center gap-2">
          <button id="langToggle"
            class="px-3 py-1.5 text-xs font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-colors font-bengali">
            বাংলা
          </button>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main id="content" class="animate-fadeIn">
      <!-- Test mode is mounted here by main.js -->
    </main>
  </div>

</body>
</html>
