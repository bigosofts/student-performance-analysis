<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Join Talent Hunt</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/questionbank.css"><link rel="stylesheet" href="css/student-practice.css"><link rel="stylesheet" href="css/talent-hunt.css"></head>
<body class="qb-font-bn th-student-body"><main class="shell student th-student-shell">
<header class="th-student-header"><div class="th-brand-mark">✦</div><div><small>LIVE CLASSROOM ARENA</small><h1>Join Talent Hunt</h1><p>Your next big moment starts here.</p></div></header>
<section class="card th-join-card" id="join"><div class="th-eyebrow">PLAYER CHECK-IN</div><div class="grid"><label>SESSION CODE<input id="joinCode" maxlength="5" placeholder="ABCDE" autocomplete="off"></label><label>YOUR NAME<input id="studentName" maxlength="40" placeholder="Enter your name"></label></div><button id="joinButton" class="primary">Join the arena <span>→</span></button><p id="message" role="status"></p></section>
<section class="card th-play-card student-interactive" id="play" hidden><div class="playbar"><span id="studentStatus">Waiting for teacher…</span><span id="countdown" class="th-countdown"></span></div><div id="studentQuestion" class="th-student-question"></div><div id="answerNotice" class="answer-reveal"></div></section>
<section class="card" id="results" hidden><div class="th-trophy">🏆</div><h2>Final results</h2><div id="finalScores"></div></section>
</main><script src="/socket.io/socket.io.js"></script><script src="js/questionbank.js"></script><script src="js/talent-hunt.js"></script><script>TalentHunt.student();</script></body></html>
